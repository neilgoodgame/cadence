<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Sign in - Cadence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }
        .card {
            max-width: 360px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 28px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 4px; }
        p.sub { color: #666; margin: 0 0 20px; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #333; }
        input[type=email], input[type=password] {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        .errors { color: #b00020; font-size: 0.85rem; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in to Cadence</h1>
        <p class="sub">Sign in to continue.</p>
        {% if form.errors %}
            <div class="errors">Incorrect email or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="id_username">Email</label>
            <input type="email" name="username" id="id_username" autofocus required>
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>

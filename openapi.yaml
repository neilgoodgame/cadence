openapi: 3.1.0
info:
  title: Cadence API
  version: "1.0.0"
  summary: REST API for the Cadence training platform.
  description: >
    A REST API over the same data model that powers the Cadence app — activities
    and their 1 Hz streams, designed workouts, scheduling, athlete thresholds and
    zones, coaching, and gear. JSON over HTTPS, OAuth 2.0, predictable resource URLs.


    ## Authentication

    OAuth 2.0 authorization code flow. Send the access token as a bearer header on
    every request:


    `Authorization: Bearer cad_at_9f2a7c…`


    ## Pagination

    List endpoints are cursor-paginated. Pass `cursor` from the previous response's
    `next_cursor`, plus an optional `limit` (max 200).


    ## Query language (CQL)

    The `q` parameter on `GET /v1/activities` accepts the same query language as the
    Activities search bar — field comparisons (`>` `<` `>=` `<=` `=` `!=`), boolean
    `AND` / `OR`, and `ORDER BY`. Example:
    `sport = run AND tag ~ race AND distance > 42.2km`.
  contact:
    name: Cadence Developer Platform
    url: https://developers.cadence.cc
  license:
    name: Proprietary

servers:
  - url: https://api.cadence.cc
    description: Production

security:
  - oauth2: []
  - bearerAuth: []

tags:
  - name: Authentication
    description: Obtain and refresh access tokens, and identify the current user.
  - name: Activities
    description: The core resource — list with CQL filtering, upload, read, edit.
  - name: Streams & curves
    description: Laps, the 1 Hz record stream, and power/HR duration curves.
  - name: Best efforts
    description: Personal records across durations (power) and distances (pace).
  - name: Tags
    description: Manual and auto-generated labels, and their activity joins.
  - name: Workouts
    description: Designed workout templates and their step structure.
  - name: Scheduling
    description: Place designed workouts on the calendar and reconcile against activities.
  - name: Athletes & zones
    description: Profile, thresholds, the four editable zone sets, and fitness trend.
  - name: Sharing
    description: Grant other people Viewer or Coach access to your training.
  - name: Access tokens
    description: Personal access tokens for scripting against the API as yourself.
  - name: Coaching
    description: Roster access for coaches.
  - name: Gear
    description: Bikes with wear components and service history, and shoes via the catalog.
  - name: Races
    description: Goal races, A/B/C priority, training blocks, splits and coach comments.
  - name: Courses
    description: Reusable race courses - route, elevation profile and climbs, from a GPX upload or an activity's GPS track.
  - name: Webhooks
    description: Subscribe to platform events.
  - name: Garmin
    description: Link a Garmin Connect account so activities can be pulled in on request.

paths:
  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Create an account
      operationId: registerAccount
      security: []
      description: >
        Creates a new athlete account with email + password, or links a social
        identity (Strava, Google, Apple). Returns the new athlete and an initial
        token pair. Social signups omit `password` and pass a `provider` + `id_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 10 }
                provider:
                  type: string
                  enum: [strava, google, apple]
                  description: For social signup instead of email/password.
                id_token:
                  type: string
                  description: The provider's identity token (social signup).
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  athlete:
                    $ref: "#/components/schemas/Athlete"
                  tokens:
                    $ref: "#/components/schemas/TokenResponse"
        "409":
          description: An account with that email already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many registration attempts from this client - retry later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email + password
      operationId: login
      security: []
      description: >
        Authenticates an existing email/password account and returns the athlete and
        a fresh token pair. There is no separate session step - this issues real
        bearer tokens directly, the same way `/v1/auth/register` does for a brand-new
        account. Social-linked accounts (no password set) cannot use this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  athlete:
                    $ref: "#/components/schemas/Athlete"
                  tokens:
                    $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Confirm an email address
      operationId: verifyEmail
      security: []
      description: >
        Redeems the one-time token from the link sent by `POST /v1/auth/register` (or
        `POST /v1/auth/resend-verification`), marking the account's `email_verified` true.
        Public - the link may be opened in a browser with no session of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204":
          description: Verified.
        "400":
          description: The token is invalid, already used, or has expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend the verification email
      operationId: resendVerificationEmail
      description: >
        Sends a fresh verification link to the signed-in athlete's own address, invalidating
        none of their access - only usable while `email_verified` is still false, and rate
        limited per athlete.
      responses:
        "204":
          description: Sent.
        "409":
          description: This email address is already verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: A verification email was sent too recently - retry later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /oauth/token:
    post:
      tags: [Authentication]
      summary: Exchange code for tokens
      operationId: createToken
      security: []
      description: >
        Exchanges an authorization code (or a refresh token) for an access token.
        Tokens are scoped to the granting athlete or coach.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                  description: The code returned to your redirect URI.
                refresh_token:
                  type: string
                  description: Used when refreshing.
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/jwt:
    post:
      tags: [Authentication]
      summary: Mint a scoped JWT
      operationId: createJwt
      description: >
        Mints a short-lived RS256 bearer JWT. The `sub` claim is the authenticated
        principal (an athlete, or a coach) and is never reassigned, so the audit
        trail always reflects who acted. The `athlete_id` claim names the athlete
        whose data the token grants access to; the API authorizes every request by
        checking that `sub` may act on `athlete_id` — either `sub == athlete_id`,
        `sub` is a coach with that athlete on their roster, or `sub` has been granted
        a share (Viewer or Coach) by that athlete. Viewer grants are read-only. When
        `athlete_id` is omitted it defaults to `sub`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                athlete_id:
                  type: string
                  description: The athlete whose data to authorize. Defaults to the caller.
                scopes:
                  type: array
                  items: { type: string }
                  description: Subset of the caller's scopes. Defaults to activities:read.
                expires_in:
                  type: integer
                  description: Lifetime in seconds, max 86400.
                  default: 3600
                  maximum: 86400
      responses:
        "201":
          description: A signed bearer JWT and its decoded claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /.well-known/jwks.json:
    get:
      tags: [Authentication]
      summary: Token signing keys (JWKS)
      operationId: getJwks
      security: []
      description: >
        The public JSON Web Key Set used to verify the RS256 signature of tokens
        issued by `/v1/auth/jwt`. Cache and key off the token header `kid`.
      responses:
        "200":
          description: The active key set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

  /v1/me:
    get:
      tags: [Authentication]
      summary: The authenticated user
      operationId: getMe
      description: >
        Returns the user tied to the access token. A user has a single account with
        their own athlete profile; `is_coach` indicates they also coach others. Use
        `/v1/me/contexts` to list the athletes they can act on.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/contexts:
    get:
      tags: [Authentication]
      summary: Switchable contexts
      operationId: getContexts
      description: >
        Returns every context the signed-in user can act in — their own training
        plus each athlete they coach (via an active user_relationship). Powers
        the account/context switcher. Switching context just changes the
        `athlete_id` you pass (or mint a JWT for); `sub` stays the signed-in user.
      responses:
        "200":
          description: Self plus coached athletes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  self:
                    $ref: "#/components/schemas/User"
                  coaching:
                    type: array
                    description: Athletes this user coaches.
                    items:
                      $ref: "#/components/schemas/CoachedAthlete"
                  coached_by:
                    type: array
                    description: Users who can view/coach this user.
                    items:
                      $ref: "#/components/schemas/Share"

  /v1/activities:
    get:
      tags: [Activities]
      summary: List & query activities
      operationId: listActivities
      description: >
        Lists activities for the athlete. The `q` parameter accepts CQL — the same
        query language as the Activities search bar — for field comparisons,
        AND/OR, and ordering.
      parameters:
        - name: q
          in: query
          description: "CQL filter, e.g. `avg_hr > 140 AND sport = run`."
          schema: { type: string }
        - name: sort
          in: query
          description: "Field to sort by; prefix with `-` for descending (e.g. `-tss`)."
          schema: { type: string }
        - name: sport
          in: query
          schema:
            $ref: "#/components/schemas/Sport"
        - name: environment
          in: query
          description: Filter by outdoor or indoor (treadmill / trainer).
          schema:
            type: string
            enum: [outdoor, indoor]
        - name: limit
          in: query
          description: Page size, max 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Activities]
      summary: Upload a .fit file
      operationId: uploadActivity
      description: >
        Uploads an activity file (multipart/form-data). Optional fields capture the
        pre/post weigh-in, fluids, and the shoe worn — the same metadata the Import
        screen collects.


        Parsing is **asynchronous** and may take an unknown amount of time, so this
        returns `202 Accepted` immediately with an upload job in the `processing`
        state, plus a `Location` header pointing at the job. Poll
        `GET /v1/uploads/{id}` until `status` is `ready` (the body then carries the
        created `activity_id`) or `failed`, or subscribe to the `activity.created`
        webhook to be notified without polling. Duplicate files resolve to the
        existing activity with status `duplicate`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The .fit / .gpx / .tcx file.
                weight_before_kg:
                  type: number
                  format: float
                weight_after_kg:
                  type: number
                  format: float
                fluids_ml:
                  type: integer
                shoe_id:
                  type: string
                  description: Shoe worn (run activities).
      responses:
        "202":
          description: Upload accepted and queued for processing.
          headers:
            Location:
              description: URL of the upload job to poll.
              schema: { type: string, example: /v1/uploads/upl_8KQ2a7 }
            Retry-After:
              description: Suggested seconds to wait before the first poll.
              schema: { type: integer, example: 2 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: This file has already been uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "413":
          description: The file exceeds the maximum upload size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Activities]
      summary: Delete all activities
      operationId: deleteAllActivities
      description: >
        Permanently deletes every one of the athlete's activities and their streams.
        Upload records are kept but unlinked, so the same files can be re-imported
        later without being flagged as duplicates.
      responses:
        "204":
          description: All activities deleted.

  /v1/activities/batch:
    post:
      tags: [Activities]
      summary: Bulk-upload a .zip of .fit files
      operationId: uploadActivityBatch
      description: >
        Uploads a `.zip` archive containing many `.fit` / `.gpx` / `.tcx` files for
        bulk import — e.g. a full export from another platform. The archive is
        unpacked server-side and each file becomes its own asynchronous `Upload`
        job, so this returns `202 Accepted` with a **batch** job plus a `Location`
        header. Poll `GET /v1/uploads/batches/{id}` for aggregate progress and the
        per-file results, or subscribe to the `activity.created` webhook (one event
        per parsed file) and `upload_batch.completed` (one event when the whole
        batch settles). Per-file weigh-in / fluids / shoe metadata cannot be set
        here; edit individual activities afterwards. Files that duplicate existing
        activities are skipped and counted under `duplicate`; valid FIT files with
        no activity data (e.g. the metadata stubs Garmin account exports mix in
        with real activities) are counted under `skipped`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A .zip archive of activity files (max 50000 files, 200 MB).
                on_duplicate:
                  type: string
                  enum: [skip, replace]
                  default: skip
                  description: What to do when a file matches an existing activity.
      responses:
        "202":
          description: Archive accepted and being unpacked; files queued individually.
          headers:
            Location:
              description: URL of the batch job to poll.
              schema: { type: string, example: /v1/uploads/batches/bat_3Yc1Qd }
            Retry-After:
              description: Suggested seconds to wait before the first poll.
              schema: { type: integer, example: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatch"
        "400":
          description: The archive could not be read or contained no supported files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The archive exceeds the size or file-count limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/uploads/history:
    delete:
      tags: [Activities]
      summary: Clear upload history
      operationId: clearUploadHistory
      description: >
        Deletes all non-essential upload records for the authenticated athlete — skipped,
        failed, duplicate, and any unlinked records. Upload records that protect a live
        activity from duplicate re-import (status `ready` with an `activity_id`) are kept.
        The stored source files for deleted records are also removed from storage.
      responses:
        "200":
          description: Upload history cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadHistoryPurge"

  /v1/uploads/batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Activities]
      summary: Poll a bulk-upload batch
      operationId: getUploadBatch
      description: >
        Returns aggregate progress for a `.zip` batch and the state of each child
        upload. `status` is `processing` until every file has settled, then
        `completed` (some children may still be `failed` or `duplicate` — inspect
        `counts` and `uploads`). Poll with backoff, honouring `Retry-After`.
      responses:
        "200":
          description: The current state of the batch.
          headers:
            Retry-After:
              description: Present while processing — seconds to wait before polling again.
              schema: { type: integer, example: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadBatch"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Activities]
      summary: Poll an upload job
      operationId: getUpload
      description: >
        Returns the status of an asynchronous upload. While `status` is `processing`
        the `activity_id` is null; once `ready` it points at the created activity.
        On `failed` an `error` object explains why. Clients should poll with backoff,
        honouring the `Retry-After` header.
      responses:
        "200":
          description: The current state of the upload job.
          headers:
            Retry-After:
              description: Present while processing — seconds to wait before polling again.
              schema: { type: integer, example: 3 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activities/{id}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Activities]
      summary: Retrieve an activity
      operationId: getActivity
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Activities]
      summary: Update an activity
      operationId: updateActivity
      description: >
        Edit mutable fields — rename, change sport, or link/unlink a designed
        workout for matching. For activities without sensor-derived environmental
        data (rides, or runs without a Stryd) avg_air_temp and avg_humidity may be
        set manually here; for runs that carry Stryd stream data they are computed
        and read-only. aerobic_training_effect/anaerobic_training_effect may
        always be set manually, with no such guard - see their own description.
        Set primary_activity_id to mark this activity as a
        duplicate recording of another (or null to unlink); duplicates drop out
        of lists, the calendar, and training load until unlinked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sport:
                  $ref: "#/components/schemas/Sport"
                workout_id:
                  type: [string, "null"]
                  description: Link a designed workout, or null to clear.
                primary_activity_id:
                  type: [string, "null"]
                  description: >
                    Mark this activity as a duplicate recording of the given
                    primary activity, or null to unlink. Rejected (400) when the
                    target is itself a duplicate, when this activity has
                    duplicates of its own, on self-links, and for multisport
                    parents or legs; 404 when the target belongs to another
                    athlete.
                start_weight_kg: { type: [number, "null"] }
                end_weight_kg: { type: [number, "null"] }
                fluids_ml: { type: [integer, "null"] }
                avg_air_temp:
                  type: [number, "null"]
                  description: >
                    Manually set the average air temperature (°C). Ignored (read-only)
                    for runs that already have computed values from Stryd stream data.
                  example: 24.0
                avg_humidity:
                  type: [integer, "null"]
                  description: >
                    Manually set the average relative humidity (% RH). Ignored for runs
                    with computed Stryd values.
                  example: 60
                aerobic_training_effect:
                  type: [number, "null"]
                  description: >
                    Manually set aerobic training effect (0.0-5.0). Unlike avg_air_temp/
                    avg_humidity, always directly writable, never ignored - a FIT-embedded
                    total_training_effect is Garmin-device-only to begin with, and a
                    Zwift-originated file routed through Garmin Connect often carries a
                    meaningless 0.0 placeholder rather than Connect's own cloud-computed
                    value, which never gets written back into the downloadable FIT.
                    Recomputes training_effect_label.
                  example: 3.3
                anaerobic_training_effect:
                  type: [number, "null"]
                  description: Manually set anaerobic training effect (0.0-5.0). Same rationale/availability as aerobic_training_effect.
                  example: 0.0
      responses:
        "200":
          description: The updated activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Activities]
      summary: Delete an activity
      operationId: deleteActivity
      description: Permanently deletes the activity and its streams.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activities/{id}/laps:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Streams & curves]
      summary: List laps
      operationId: listLaps
      description: Returns the activity's splits in order.
      responses:
        "200":
          description: Laps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lap"

  /v1/activities/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Comments]
      summary: List an activity's comments
      operationId: listActivityComments
      description: >
        Anyone with read access to the activity's athlete (the athlete, a coach,
        or a viewer share) can list comments — this is a read-gated social
        feature, not a write-mutation. Oldest first.
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityComment"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Comments]
      summary: Comment on an activity
      operationId: createActivityComment
      description: Same read-gated access as listing — no separate write scope is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/activities/{id}/comments/{comment_id}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
      - name: comment_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Comments]
      summary: Delete a comment
      operationId: deleteActivityComment
      description: Only the comment's own author may delete it, regardless of read/write access to the activity.
      responses:
        "204":
          description: Comment deleted.
        "403":
          description: Not the comment's author.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activities/{id}/infer-workout:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Streams & curves]
      summary: Infer a workout structure from a recorded activity's laps
      operationId: inferWorkout
      description: >
        Read-only/idempotent — does not create a `Workout`. Turns the activity's
        laps into a step tree shaped like `WorkoutCreate`, suitable for opening as
        an unsaved draft in the workout builder. Only `bike`/`run` activities with
        at least one lap are eligible.
      parameters:
        - name: auto_detect_repeats
          in: query
          description: When true, collapses repeated contiguous lap patterns (e.g. 5×[work, rest]) into `repeat` groups.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Inferred workout draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  sport: { type: string, enum: [bike, run] }
                  steps:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutStep" }
        "400":
          description: Activity isn't bike/run, or has no laps.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activities/{id}/sections:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Activities]
      summary: Flat, climb and descent sections of a run, walk or ride
      operationId: getActivitySections
      description: >
        The course sections calculation applied to the activity's recorded altitude, with the
        owning athlete's course_section_settings. The optional query parameters override those
        settings for this response only, exactly as on GET /v1/courses/{id}. The activity's
        elevation is resampled every 10 m and stored on the first request.
      parameters:
        - { name: algorithm, in: query, required: false, schema: { type: string, enum: [douglas_peucker, bottom_up] } }
        - { name: flat_max_pct, in: query, required: false, schema: { type: number } }
        - { name: steep_min_pct, in: query, required: false, schema: { type: number } }
        - { name: fit_tolerance_m, in: query, required: false, schema: { type: number } }
        - { name: min_section_m, in: query, required: false, schema: { type: number } }
        - { name: keep_min_rise_m, in: query, required: false, schema: { type: number } }
        - { name: spike_window_m, in: query, required: false, schema: { type: number } }
        - { name: smoothing_window_m, in: query, required: false, schema: { type: number } }
        - { name: resample_step_m, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: The activity's sections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySections" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The activity isn't a run, walk or ride.

  /v1/activities/{id}/recompute-elevation:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      tags: [Activities]
      summary: Rebuild an activity's stored elevation series
      operationId: recomputeActivityElevation
      description: >
        Rebuilds the stored 10 m elevation series from the activity's records. Section settings
        apply at read time, so changing them never needs this.
      responses:
        "200":
          description: The activity's sections from the rebuilt series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySections" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The activity isn't a run, walk or ride.

  /v1/activities/{id}/splits:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Activities]
      summary: Splits for an activity
      operationId: getActivitySplits
      description: >
        Manual laps, fixed 1km/5km splits, or (elevation) one split per flat/climb/descent
        section of the activity's own recorded elevation (the same calculation as GET
        /v1/activities/{id}/sections). Unlike GET /v1/races/{id}/splits, there's no goal/target
        reference and so no delta_vs_ref_s_per_km/delta_power_w - a plain activity has nothing to
        compare against. elevation falls back to the normal empty shape (splits: [],
        has_laps: false) when the activity's elevation isn't ok.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [laps, "1", "5", elevation], default: laps }
      responses:
        "200":
          description: The activity's splits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_laps: { type: boolean, description: False when mode=laps and the activity has one lap or none. }
                  halves:
                    type: [object, "null"]
                    properties:
                      first_s: { type: integer }
                      second_s: { type: integer }
                  splits:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: [string, "null"], description: "e.g. \"Lap 2\" or \"Finish\" for the last partial split." }
                        start_km: { type: number }
                        end_km: { type: number }
                        time_s: { type: integer }
                        pace_s_per_km: { type: [number, "null"] }
                        gap_pace_s_per_km:
                          type: [number, "null"]
                          description: >
                            Grade-adjusted pace - the flat-equivalent pace for the same effort,
                            from the Minetti et al. (2002) cost-of-running-on-a-gradient model.
                            Null when avg_grade_pct is null (no reliable altitude).
                        avg_hr: { type: [integer, "null"] }
                        avg_power: { type: [integer, "null"], description: Null if the activity has no power meter. }
                        section_type:
                          type: [string, "null"]
                          enum: [steep_descent, descent, flat, climb, steep_climb, null]
                          description: Set only for mode=elevation; null for laps/1/5.
                        gain_m: { type: [integer, "null"], description: Set only for mode=elevation. }
                        loss_m: { type: [integer, "null"], description: Set only for mode=elevation. }
                        avg_grade_pct:
                          type: [number, "null"]
                          description: >
                            Net grade over the split. For mode=elevation this is the section's own
                            grade; for laps/1/5 it's computed from the activity's own recorded
                            altitude (null if that's missing).
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Activities]
      summary: Custom splits for an activity, from your own list of steps
      operationId: getActivityCustomSplits
      description: >
        Like GET on this same path, but splits come from `steps` instead of a fixed mode - e.g.
        "the first mile, then every 2km after that". See CustomSplitStep for how steps are
        consumed. No goal/target reference here either - see POST /v1/races/{id}/splits for a
        goal race's own delta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomSplitsRequest" }
      responses:
        "200":
          description: The activity's custom splits - same response shape as GET on this path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_laps: { type: boolean, description: Always false - custom splits have no laps mode. }
                  halves:
                    type: [object, "null"]
                    properties:
                      first_s: { type: integer }
                      second_s: { type: integer }
                  splits:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: [string, "null"] }
                        start_km: { type: number }
                        end_km: { type: number }
                        time_s: { type: integer }
                        pace_s_per_km: { type: [number, "null"] }
                        gap_pace_s_per_km: { type: [number, "null"] }
                        avg_hr: { type: [integer, "null"] }
                        avg_power: { type: [integer, "null"] }
                        section_type:
                          type: [string, "null"]
                          enum: [steep_descent, descent, flat, climb, steep_climb, null]
                          description: Always null - no course/elevation section here.
                        gain_m: { type: [integer, "null"], description: Always null. }
                        loss_m: { type: [integer, "null"], description: Always null. }
                        avg_grade_pct: { type: [number, "null"] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activities/{id}/streams:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Streams & curves]
      summary: Read the 1 Hz stream
      operationId: getStreams
      description: >
        Returns parallel arrays sampled at 1 Hz. Request only the channels you need
        with `fields`. Indoor activities (`environment: indoor`) omit the position
        channels (`latlng`, `altitude` may also be absent); distance comes from a
        footpod or trainer instead of GPS.
      parameters:
        - name: fields
          in: query
          description: "Comma-separated channels, e.g. `time,power,heartrate,altitude,cadence`."
          schema: { type: string }
        - name: resolution
          in: query
          schema:
            type: string
            enum: [high, medium, low]
            default: high
      responses:
        "200":
          description: Stream channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Streams"

  /v1/activities/{id}/curves:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Streams & curves]
      summary: Duration curves
      operationId: getCurves
      description: >
        Mean-maximal power and HR curves. When the activity exceeds 60 minutes the
        curve extends to the full duration; the final point is the whole-activity average.
      parameters:
        - name: metric
          in: query
          schema:
            type: string
            enum: [power, heartrate]
            default: power
      responses:
        "200":
          description: A duration curve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DurationCurve"

  /v1/athletes/{id}/best-efforts:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Best efforts]
      summary: List best efforts
      operationId: listBestEfforts
      description: >
        Personal records by kind and period. Cycling returns peak power by duration;
        running returns best pace and power by distance.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [cycling_power, running_pace, running_power]
        - name: period
          in: query
          schema:
            type: string
            enum: [4w, 3m, 16w, 1y, all]
            default: all
      responses:
        "200":
          description: Best efforts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string }
                  period: { type: string }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BestEffort"

  /v1/athletes/{id}/durability:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Best efforts]
      summary: Aerobic decoupling sessions and durability (best power once tired)
      operationId: getDurability
      description: >
        Backs the Best Efforts screen's Durability view and the Activity Analysis "Aerobic
        decoupling" card's durability strip. `sessions` are qualified (steady-session)
        activities only, ascending by date. `rolling` is a trailing 28-day average per
        sport, one point per session date. `durability.cells` is the best power per
        (threshold, window_s) in the period; `pct_of_fresh` is that divided by the best
        threshold=0 power for the same window in the same period.
      parameters:
        - name: sport
          in: query
          schema: { type: string, enum: [all, ride, run], default: all }
        - name: period
          in: query
          schema: { type: string, enum: [4w, 16w, 1y, all], default: 16w }
      responses:
        "200":
          description: Decoupling sessions, rolling trend, summary and durability tables.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        activity_id: { type: string }
                        name: { type: string }
                        date: { type: string, format: date }
                        sport: { type: string, enum: [ride, run] }
                        decoupling_pct: { type: number }
                        ef: { type: [number, "null"], description: Whole-window EF (avg power / avg HR). }
                        ef_first: { type: number }
                        ef_second: { type: number }
                        steady_seconds: { type: integer }
                        hot: { type: boolean }
                        avg_temp: { type: [number, "null"] }
                        avg_core: { type: [number, "null"] }
                  rolling:
                    type: object
                    properties:
                      ride:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            decoupling_pct: { type: number }
                            ef: { type: [number, "null"] }
                      run:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            decoupling_pct: { type: number }
                            ef: { type: [number, "null"] }
                  summary:
                    type: object
                    properties:
                      count: { type: integer }
                      last28_avg: { type: [number, "null"] }
                      prev28_avg: { type: [number, "null"] }
                      last28_cool_avg: { type: [number, "null"], description: last28_avg excluding hot sessions. }
                      last28_ef: { type: [number, "null"] }
                      prev28_ef: { type: [number, "null"] }
                  durability:
                    type: object
                    properties:
                      ride: { $ref: "#/components/schemas/DurabilitySportSection" }
                      run: { $ref: "#/components/schemas/DurabilitySportSection" }

  /v1/athletes/{id}/best-efforts/ranks:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Best efforts]
      summary: Best-effort ranks for a batch of activities
      operationId: listActivityBestEffortRanks
      description: >
        Backs the Dashboard "Top efforts this week" card: for a caller-supplied batch of
        activity ids, which ones ranked top-3 in any best-effort leaderboard (16-week,
        1-year, or all-time - 4-week/3-month are excluded, they flag almost everything
        recent). Takes explicit activity ids rather than a "how far back" parameter -
        deciding which activities count as recent is a local-date/timezone-sensitive
        judgement the frontend already makes correctly for its own display (the This Week
        calendar), so it's the caller's job to pass in exactly the activities it cares
        about; this endpoint only answers "what are these specific activities' ranks".
        One entry is one activity x one best-effort category (kind + window); `ranks`
        holds that entry's 1-based rank in each tracked period, or null for a period it
        didn't reach the top-N of at all. Only entries with at least one period's rank
        <= 3 are returned - sorting/grouping/headline-period selection are a client
        concern.
      parameters:
        - name: activity_ids
          in: query
          description: Comma-separated activity ids to check. Empty or omitted returns no data.
          schema: { type: string }
      responses:
        "200":
          description: Best-effort ranks for the requested activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecentTopEffort"

  /v1/tags:
    get:
      tags: [Tags]
      summary: List tags
      operationId: listTags
      description: All tags available to the athlete, with origin.
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"

  /v1/activities/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      tags: [Tags]
      summary: Tag an activity
      operationId: tagActivity
      description: >
        Attaches a tag. Auto-tags applied by workout matching are read-only; manual
        tags can be added or removed freely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_id:
                  type: string
                  description: Attach an existing tag.
                name:
                  type: string
                  description: Or create a tag by name.
      responses:
        "201":
          description: Tag attached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity_id: { type: string }
                  tag:
                    $ref: "#/components/schemas/Tag"

  /v1/activities/{id}/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
      - name: tag_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Tags]
      summary: Remove a tag
      operationId: untagActivity
      description: Detaches a manual tag from the activity.
      responses:
        "204":
          description: Tag removed.

  /v1/workouts:
    get:
      tags: [Workouts]
      summary: List designed workouts
      operationId: listWorkouts
      description: >
        The athlete's workout library — filterable by folder/tag/sport/name and
        sortable, for the Workout Library screen.
      parameters:
        - name: folder_id
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: sport
          in: query
          schema: { type: string, enum: [bike, run] }
        - name: search
          in: query
          description: Case-insensitive substring match on workout name.
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, name, duration, tss, used]
            default: recent
          description: >
            `used` orders by how many times the workout has been scheduled
            (`ScheduledWorkout` count).
      responses:
        "200":
          description: Workouts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workout"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Workouts]
      summary: Create a workout
      operationId: createWorkout
      description: >
        Creates a structured workout. Each leaf step declares an `end_type` of
        `time`, `distance`, or `manual` (athlete taps lap to advance); `duration`
        or `distance` is set accordingly, along with a `target_type`
        (power/hr/pace/cadence/open) and `target_low`/`target_high` (equal for a
        flat target, different for a ramp), plus an optional `target2_type`
        cadence constraint. A `repeat` step instead sets `repeat` and `children`
        — children may themselves be nested `repeat` groups. `folder_id`/`tags`
        organize the workout in the library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkoutCreate"
      responses:
        "201":
          description: Workout created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/workouts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Workouts]
      summary: Retrieve a workout
      operationId: getWorkout
      description: Returns a designed workout with its full ordered step structure.
      responses:
        "200":
          description: The workout.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Workout"
                  - type: object
                    properties:
                      steps:
                        type: array
                        items:
                          $ref: "#/components/schemas/WorkoutStep"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Workouts]
      summary: Update a workout
      operationId: updateWorkout
      description: >
        Rename or re-author the workout. Passing `steps` replaces the entire step
        list; duration and TSS are recomputed. `folder_id`/`tags`, if present,
        replace the workout's folder/tags — `folder_id: null` (or `""`) clears
        the folder; omitting a field leaves it untouched. Edits do not affect
        already-completed activities matched to this workout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/WorkoutStep"
                folder_id: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated workout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workout"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Workouts]
      summary: Delete a workout
      operationId: deleteWorkout
      description: >
        Removes the workout from the library. Scheduled instances are unlinked but
        completed activities keep their match for history.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/workout-folders:
    get:
      tags: [Workouts]
      summary: List workout folders
      operationId: listWorkoutFolders
      description: The athlete's workout folders, each with its workout count.
      responses:
        "200":
          description: Folders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutFolder"
    post:
      tags: [Workouts]
      summary: Create a workout folder
      operationId: createWorkoutFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutFolder"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/workout-folders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Workouts]
      summary: Rename a workout folder
      operationId: updateWorkoutFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: The renamed folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Workouts]
      summary: Delete a workout folder
      operationId: deleteWorkoutFolder
      description: Workouts in the folder are not deleted — their `folder_id` is cleared.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/workouts/{id}/matches:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Workouts]
      summary: List matched activities
      operationId: listWorkoutMatches
      description: >
        Returns completed activities matched to this designed workout — automatically
        (inferred from lap structure) or manually — each with a match confidence and
        method. Powers the "matched workouts" view in the designer.
      parameters:
        - name: method
          in: query
          schema:
            type: string
            enum: [auto, manual, all]
            default: all
      responses:
        "200":
          description: Matched activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkoutMatch"

  /v1/calendar:
    get:
      tags: [Scheduling]
      summary: List planned & completed
      operationId: getCalendar
      description: >
        Returns scheduled workouts and completed activities in a date range.
        `unplanned_activities` covers completed activities in range that were never
        scheduled or matched to a designed workout - `data` only ever contains
        `ScheduledWorkout` rows.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: athlete_id
          in: query
          description: Coaches only — defaults to self.
          schema: { type: string }
      responses:
        "200":
          description: Calendar entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduledWorkout"
                  unplanned_activities:
                    type: array
                    description: Completed activities in range with no scheduled-workout match.
                    items:
                      $ref: "#/components/schemas/Activity"

  /v1/scheduled-workouts:
    post:
      tags: [Scheduling]
      summary: Schedule a workout
      operationId: scheduleWorkout
      description: >
        Drops a designed workout onto a date. Coaches set `athlete_id` to assign onto
        an athlete's plan; `assigned_by` is inferred from the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workout_id, athlete_id, date]
              properties:
                workout_id: { type: string }
                athlete_id: { type: string }
                date: { type: string, format: date }
                time_of_day:
                  $ref: "#/components/schemas/TimeOfDay"
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledWorkout"

  /v1/scheduled-workouts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Scheduling]
      summary: Reschedule or match
      operationId: updateScheduledWorkout
      description: Move to another date, or link the completed activity that fulfilled it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                activity_id:
                  type: string
                  description: Completed activity to match.
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledWorkout"
    delete:
      tags: [Scheduling]
      summary: Unschedule a workout
      operationId: deleteScheduledWorkout
      responses:
        "204":
          description: Removed from the calendar.

  /v1/athletes/{id}:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: Retrieve an athlete
      operationId: getAthlete
      responses:
        "200":
          description: Profile and thresholds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Athletes & zones]
      summary: Update thresholds
      operationId: updateAthlete
      description: >
        Updates profile and threshold values. Changing a threshold recomputes every
        zone set that references it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                age: { type: integer }
                weight_kg: { type: number, description: Used for the Avg Watts/kg stat on Activity Analysis. }
                ftp:
                  type: integer
                  description: >
                    Functional threshold power (W). A manually-entered value is
                    recorded as a new threshold_history entry unconditionally (no
                    outlier check - an explicit human declaration, not a computed
                    candidate) and ages out after threshold_window_days like any
                    other entry. A no-op if it matches the latest ledger entry
                    already, since this form resubmits every field on every save.
                critical_run_power: { type: integer, description: Critical running power (W). Same threshold_history semantics as ftp. }
                threshold_pace: { type: string, description: "mm:ss per km. Same threshold_history semantics as ftp." }
                threshold_window_days: { type: integer, description: See the User schema. }
                threshold_sanity_pct: { type: integer, description: See the User schema. }
                threshold_warning_days: { type: integer, enum: [14, 21, 28, 0], description: See the User schema. }
                decoupling_vi_limit_bike: { type: number, description: See the User schema. }
                decoupling_vi_limit_run: { type: number, description: See the User schema. }
                decoupling_if_limit: { type: number, description: See the User schema. }
                decoupling_min_steady_minutes: { type: integer, description: See the User schema. }
                decoupling_warmup_minutes: { type: integer, description: See the User schema. }
                decoupling_use_workout_warmup: { type: boolean, description: See the User schema. }
                decoupling_warm_air_temp: { type: number, description: See the User schema. }
                decoupling_warm_skin_temp: { type: number, description: See the User schema. }
                decoupling_hot_air_temp: { type: number, description: See the User schema. }
                decoupling_hot_skin_temp: { type: number, description: See the User schema. }
                lthr: { type: integer, description: Lactate threshold HR (bpm). }
                max_hr: { type: integer }
                resting_hr:
                  type: integer
                  description: >
                    Optional; only feeds the Karvonen HRR% stat, not a zone
                    reference threshold, so changing it never appears in
                    zones_recomputed.
                race_block_weeks: { type: integer, enum: [12, 16, 20, 24], description: See the User schema. }
                race_block_week_defaults:
                  type: object
                  additionalProperties: { type: integer }
                  description: >
                    Any subset of the per-distance-bucket keys, merged into the athlete's
                    current race_block_week_defaults (unlike most other fields here, this is
                    never a full replace). See the User schema.
                race_key_session_cap: { type: integer, enum: [6, 8, 10, 12, 15, 20], description: See the User schema. }
                course_section_settings:
                  allOf:
                    - $ref: "#/components/schemas/CourseSectionSettings"
                  description: >
                    Any subset of the settings, merged into the athlete's current ones; the
                    merged result must satisfy every range (400 otherwise, nothing saved).
      responses:
        "200":
          description: Updated athlete.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Athlete"
                  - type: object
                    properties:
                      zones_recomputed:
                        type: array
                        items: { type: string }

  /v1/athletes/{id}/thresholds:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: Threshold summary
      operationId: getThresholds
      description: >
        Current + previous value and staleness for ftp, critical_run_power, and
        threshold_pace - what the dashboard's threshold widget reads. No recompute
        here; stale just means "will update on the next activity, or via a manual
        refresh."
      responses:
        "200":
          description: Threshold summary for all three fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ftp: { $ref: "#/components/schemas/ThresholdSummaryEntry" }
                  critical_run_power: { $ref: "#/components/schemas/ThresholdSummaryEntry" }
                  threshold_pace: { $ref: "#/components/schemas/ThresholdSummaryEntry" }

  /v1/athletes/{id}/threshold-history:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: Threshold history ledger
      operationId: getThresholdHistory
      description: The full history for one field, most recent first.
      parameters:
        - name: field
          in: query
          required: true
          schema: { type: string, enum: [ftp, critical_run_power, threshold_pace] }
      responses:
        "200":
          description: The ledger for the requested field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  field: { type: string, enum: [ftp, critical_run_power, threshold_pace] }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ThresholdHistoryEntry" }

  /v1/athletes/{id}/threshold-suggestions:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: Threshold suggestions
      operationId: listThresholdSuggestions
      description: >
        Actionable suggestions where the auto-derivation in GET
        /v1/athletes/{id}/thresholds falls short: a qualifying effort the sanity
        band rejected ("rejected" - a real breakthrough, or a recalibrated/corrupt
        sensor; the athlete decides), or a current value about to age out of
        threshold_window_days with nothing dismissing it ("upcoming_drop", or
        "race_will_refresh" when a booked race should refresh it naturally first).
        LTHR is deliberately excluded - it's a stable, manually-set value, and HR
        bests are too noisy (heat, drift, sensor spikes) for either suggestion
        type. Cached per athlete for 24 hours, invalidated on anything that could
        change the list (activity ingest/import, a threshold write, a setting
        change, a race change, or an accept/dismiss).
      responses:
        "200":
          description: Pending suggestions, rejected first, then upcoming_drop/race_will_refresh by days_left ascending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ThresholdSuggestion" }

  /v1/athletes/{id}/threshold-suggestions/{suggestion_id}/accept:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
      - name: suggestion_id
        in: path
        required: true
        schema: { type: string }
        description: "A suggestion's own id, e.g. ftp:rejected:act_123 - stable for its lifetime."
    post:
      tags: [Athletes & zones]
      summary: Accept a rejected candidate
      operationId: acceptThresholdSuggestion
      description: >
        Accepts a "rejected" suggestion as real: records it as a genuine
        threshold_history entry and updates the athlete's cached profile value.
        The candidate activity bypasses the sanity band for this field from now
        on (even across a full history rebuild), so it won't be rejected again.
        404 if the suggestion no longer exists.
      responses:
        "200":
          description: The new current threshold_history entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThresholdHistoryEntry" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Athletes & zones]
      summary: Undo an accept
      operationId: undoAcceptThresholdSuggestion
      description: >
        Removes the accept override and re-runs the normal windowed recompute -
        the candidate goes back to being sanity-filtered like any other activity.
      responses:
        "204":
          description: Reverted.

  /v1/athletes/{id}/threshold-suggestions/{suggestion_id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
      - name: suggestion_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Athletes & zones]
      summary: Dismiss a suggestion
      operationId: dismissThresholdSuggestion
      description: >
        Silences this one specific occurrence - a candidate activity id for
        "rejected", or a source-activity+expiry-date pair for "upcoming_drop" - so
        a genuinely different future occurrence of the same kind for the same
        field is never silenced by an old dismissal. Not valid for
        "race_will_refresh" (it's a quiet note, not a dismissable card) - 404.
      responses:
        "204":
          description: Dismissed.
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Athletes & zones]
      summary: Undo a dismiss
      operationId: undoDismissThresholdSuggestion
      responses:
        "204":
          description: Reverted.

  /v1/athletes/{id}/zones:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: List zone sets
      operationId: listZones
      description: The four zone sets — heart_rate, bike_power, run_power, pace — with computed boundaries.
      responses:
        "200":
          description: Zone sets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ZoneSet"

  /v1/athletes/{id}/zones/{type}:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [heart_rate, bike_power, run_power, pace]
    put:
      tags: [Athletes & zones]
      summary: Replace a zone set
      operationId: replaceZoneSet
      description: >
        Replaces the boundaries for one zone type. Percentages are relative to the
        type's reference threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zones]
              properties:
                zones:
                  type: array
                  items:
                    $ref: "#/components/schemas/Zone"
      responses:
        "200":
          description: Zone set replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  reference: { type: number }
                  updated: { type: boolean }

  /v1/athletes/{id}/fitness:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Athletes & zones]
      summary: Fitness trend (CTL/ATL/TSB)
      operationId: getFitnessTrend
      description: >
        Returns the daily performance-management series — fitness (CTL), fatigue
        (ATL), and form (TSB) — that drives the dashboard training-load chart.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: A daily fitness series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FitnessPoint"

  /v1/shares:
    get:
      tags: [Sharing]
      summary: List people with access
      operationId: listShares
      description: Everyone you have granted Viewer or Coach access to your training.
      responses:
        "200":
          description: Active and pending shares.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Share"
    post:
      tags: [Sharing]
      summary: Invite someone
      operationId: createShare
      description: >
        Grants another person access to your data. A `viewer` gets read-only access
        to activities, analysis, workouts, and calendar; a `coach` can additionally
        create and assign workouts to you. The invitee is identified by email or
        handle and starts in `pending` until they accept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitee, role]
              properties:
                invitee:
                  type: string
                  description: Email address or @handle.
                role:
                  $ref: "#/components/schemas/ShareRole"
      responses:
        "201":
          description: Invitation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Sharing]
      summary: Change a person's role
      operationId: updateShare
      description: Promote a viewer to coach, or demote a coach to viewer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/ShareRole"
      responses:
        "200":
          description: Updated share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
    delete:
      tags: [Sharing]
      summary: Revoke access
      operationId: deleteShare
      description: Immediately revokes the person's access to your data.
      responses:
        "204":
          description: Access revoked.

  /v1/auth/tokens:
    get:
      tags: [Access tokens]
      summary: List personal access tokens
      operationId: listAccessTokens
      description: >
        Lists your personal access tokens. Only the prefix is returned — the secret
        is shown once at creation and never again.
      responses:
        "200":
          description: Active tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessToken"
    post:
      tags: [Access tokens]
      summary: Create a personal access token
      operationId: createAccessToken
      description: >
        Creates a long-lived bearer token scoped to your own data (`sub` is you).
        The full secret is returned **once** in this response. Use it as
        `Authorization: Bearer <secret>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  description: A label to recognise the token, e.g. "Home server sync".
                scopes:
                  type: array
                  items: { type: string }
                  description: Subset of your scopes (e.g. activities:read).
                expires_at:
                  type: [string, "null"]
                  format: date
                  description: Expiry date, or null for no expiry.
      responses:
        "201":
          description: Token created — secret shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: The full token. Shown only here.
                        example: cad_pat_7QdaKf2m9XbV3nLpZ0rT8wYc1Hs4
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Access tokens]
      summary: Revoke a token
      operationId: revokeAccessToken
      description: Permanently revokes the token. Requests using it will 401 immediately.
      responses:
        "204":
          description: Token revoked.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/auth/tokens/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Access tokens]
      summary: Rotate a token
      operationId: rotateAccessToken
      description: >
        Issues a new secret for the same token, keeping its name and scopes, and
        invalidates the old secret. The new secret is returned **once**.
      responses:
        "200":
          description: Rotated — new secret shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: The new token. Shown only here.
                        example: cad_pat_M2pKx9Lq4Rb7Vn0Zt6wYc3Hs8dF1
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/coach/athletes:
    get:
      tags: [Coaching]
      summary: List roster
      operationId: listRoster
      description: Athletes linked to the authenticated coach, with compliance and form.
      responses:
        "200":
          description: Roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterEntry"

  /v1/coach/athletes/{id}:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    get:
      tags: [Coaching]
      summary: Athlete detail
      operationId: getCoachAthlete
      description: A single athlete's training summary, scoped to the coach relationship.
      responses:
        "200":
          description: Athlete training summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAthlete"

  /v1/gear/bikes:
    get:
      tags: [Gear]
      summary: List bikes
      operationId: listBikes
      description: Garage bikes with aggregate distance and component wear.
      responses:
        "200":
          description: Bikes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bike"
    post:
      tags: [Gear]
      summary: Add a bike
      operationId: createBike
      description: Adds a bike to the garage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                kind: { type: string, enum: [road, indoor, gravel, tt] }
                groupset: { type: string }
                distance_km: { type: integer, default: 0 }
      responses:
        "201":
          description: Bike added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bike"

  /v1/gear/shoes:
    get:
      tags: [Gear]
      summary: List shoes
      operationId: listShoes
      description: >
        Run shoes resolved through the catalog. `name` defaults to the composed
        manufacturer + model + version + colourway and is unique per athlete.
      responses:
        "200":
          description: Shoes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shoe"
    post:
      tags: [Gear]
      summary: Add a pair of shoes
      operationId: createShoe
      description: >
        Registers a physical pair against a catalog model version. `name` is optional
        — it defaults to the composed catalog string and must be unique per athlete.
        `image` is an optional URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shoe_model_version_id, colourway]
              properties:
                shoe_model_version_id: { type: string }
                colourway: { type: string }
                name:
                  type: string
                  description: Override; unique; defaults to the composed name.
                limit_km: { type: integer }
                image:
                  type: [string, "null"]
                  format: uri
      responses:
        "201":
          description: Shoe registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shoe"

  /v1/gear/shoes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Gear]
      summary: Update a pair of shoes
      operationId: updateShoe
      description: >
        Edit a pair — rename, adjust the retirement limit, set or change the image,
        correct mileage, or retire it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                limit_km: { type: integer }
                km: { type: integer, description: Correct accumulated distance. }
                image: { type: [string, "null"], format: uri }
                retired: { type: boolean }
      responses:
        "200":
          description: Updated shoe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shoe"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Gear]
      summary: Delete a pair of shoes
      operationId: deleteShoe
      description: Removes the shoes. Past activities keep their shoe reference for history.
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/gear/shoe-catalog:
    get:
      tags: [Gear]
      summary: Search the shoe catalog
      operationId: searchShoeCatalog
      description: >
        Type-ahead over the manufacturer → model → version catalog that backs the
        "add shoes" picker. Returns model versions with their composed display name.
      parameters:
        - name: q
          in: query
          description: Search text across manufacturer and model.
          schema: { type: string }
      responses:
        "200":
          description: Matching catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShoeCatalogEntry"

  /v1/gear/bikes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Gear]
      summary: Retrieve a bike
      operationId: getBike
      description: A bike with its full component list and service status.
      responses:
        "200":
          description: The bike.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Bike"
                  - type: object
                    properties:
                      components:
                        type: array
                        items:
                          $ref: "#/components/schemas/Component"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Gear]
      summary: Update a bike
      operationId: updateBike
      description: Rename, change type/groupset, or correct accumulated distance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                kind: { type: string, enum: [road, indoor, gravel, tt] }
                groupset: { type: string }
                distance_km: { type: integer }
      responses:
        "200":
          description: Updated bike.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bike"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Gear]
      summary: Delete a bike
      operationId: deleteBike
      description: Removes the bike and its components. Past activities keep their reference.
      responses:
        "204":
          description: Deleted.

  /v1/gear/bikes/{id}/components:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Gear]
      summary: Add a component
      operationId: createComponent
      description: >
        Tracks a wear part on the bike (chain, tyres, cassette, …) with a distance
        limit so the app can flag service.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, limit_km]
              properties:
                name: { type: string, example: Chain }
                limit_km: { type: integer, example: 4000 }
                km: { type: integer, default: 0, description: Distance already on the part. }
                model: { type: string, example: KMC X11SL }
      responses:
        "201":
          description: Component added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"

  /v1/gear/components/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Gear]
      summary: Update a component
      operationId: updateComponent
      description: Adjust the limit, correct mileage, or change the fitted model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                limit_km: { type: integer }
                km: { type: integer }
                model: { type: string }
      responses:
        "200":
          description: Updated component.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Component"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Gear]
      summary: Remove a component
      operationId: deleteComponent
      description: Removes the wear part from the bike.
      responses:
        "204":
          description: Removed.

  /v1/gear/components/{id}/service:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Gear]
      summary: Log service / replacement
      operationId: serviceComponent
      description: >
        Records maintenance on a component. `reset` zeroes the accumulated distance
        (e.g. a new chain); otherwise it logs an inspection/clean without resetting.
        Appears in the bike's maintenance history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [replaced, cleaned, inspected, adjusted]
                  example: replaced
                reset:
                  type: boolean
                  default: true
                  description: Zero the part's mileage (true for a replacement).
                note: { type: string }
                date: { type: string, format: date }
      responses:
        "201":
          description: Service logged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  /v1/races:
    get:
      tags: [Races]
      summary: List races
      operationId: listRaces
      description: Upcoming and past races, any sport, all priorities.
      responses:
        "200":
          description: Races.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Race"
    post:
      tags: [Races]
      summary: Add a race
      operationId: createRace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, date]
              properties:
                name: { type: string }
                date: { type: string, format: date }
                sport: { $ref: "#/components/schemas/Sport" }
                priority: { type: string, enum: [A, B, C], default: A }
                course_id: { type: [string, "null"], description: An existing course to link. }
                distance_km: { type: number }
                goal_time: { type: [string, "null"], description: "H:MM:SS, optional and editable later." }
                result_time: { type: [string, "null"], description: "H:MM:SS, set once the race has happened." }
                target_power: { type: [integer, "null"], description: "Watts, optional and editable later." }
                activity_id: { type: [string, "null"], description: The matching recorded activity, if any. }
                url: { type: [string, "null"], format: uri }
                results_url: { type: [string, "null"], format: uri }
                notes: { type: string }
                key_session_tag_id:
                  type: [string, "null"]
                  description: Overrides the athlete-wide "Key session" tag lookup for this race's key_sessions "tagged" category. Null uses that default.
                block_weeks_requested: { type: [integer, "null"], description: "A races only - see the Race schema's own field." }
                base_weeks_requested: { type: [integer, "null"], description: "A races only - must be set together with build/peak/taper_weeks_requested, summing to block_weeks_requested." }
                build_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
                peak_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
                taper_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
      responses:
        "201":
          description: Race created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Race" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/races/{id}:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Retrieve a race
      operationId: getRace
      responses:
        "200":
          description: Race.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Race" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Races]
      summary: Update a race
      operationId: updateRace
      description: Editing and deleting a race happen only on the race's own page - there is no separate race list to edit from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                date: { type: string, format: date }
                sport: { $ref: "#/components/schemas/Sport" }
                priority: { type: string, enum: [A, B, C] }
                course_id: { type: [string, "null"] }
                distance_km: { type: number }
                goal_time: { type: [string, "null"], description: "H:MM:SS, or null to remove the goal." }
                result_time: { type: [string, "null"] }
                target_power: { type: [integer, "null"] }
                activity_id: { type: [string, "null"] }
                url: { type: [string, "null"], format: uri }
                results_url: { type: [string, "null"], format: uri }
                notes: { type: string }
                key_session_tag_id: { type: [string, "null"] }
                is_public:
                  type: boolean
                  description: >
                    Make the race readable without authentication via
                    GET /v1/public/races/{id} (and its splits and weather), or false to
                    revoke that.
                block_weeks_requested: { type: [integer, "null"], description: "A races only - see the Race schema's own field." }
                base_weeks_requested: { type: [integer, "null"], description: "A races only - must be set together with build/peak/taper_weeks_requested, summing to block_weeks_requested." }
                build_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
                peak_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
                taper_weeks_requested: { type: [integer, "null"], description: "A races only - see base_weeks_requested." }
      responses:
        "200":
          description: Updated race.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Race" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Races]
      summary: Delete a race
      operationId: deleteRace
      responses:
        "204":
          description: Race deleted.
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/races/{id}/block:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Training block (A race) or 5-week window (B/C race)
      operationId: getRaceBlock
      description: >
        An A race's full training block, using the athlete's `race_block_weeks`
        preference, truncated if an earlier A race's block would otherwise
        overlap it (`truncated_by_race_id`). A B/C race instead gets a window
        (`phases` is empty and `parent` replaces `comparison`/`prediction`/
        `durability`): if it falls inside an upcoming A race's own block, its
        window starts where that A block starts and ends at the race itself
        (its own final week) - length varies with where in the parent block
        the race falls. Otherwise it gets a fixed 5-week window centred on
        the race.
      responses:
        "200":
          description: Weekly breakdown, race-day form, comparison, prediction, key sessions and durability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  start: { type: string, format: date }
                  end: { type: string, format: date }
                  weeks_requested: { type: integer, description: The preference/window length asked for, before any truncation. }
                  truncated_by_race_id: { type: [string, "null"] }
                  phases:
                    type: array
                    description: Empty for a B/C race.
                    items:
                      type: object
                      properties:
                        name: { type: string, enum: [Base, Build, Peak, Taper] }
                        start_week: { type: integer, description: 1-based index into `weeks` below. }
                        end_week: { type: integer }
                  parent:
                    type: [object, "null"]
                    description: B/C races only - the containing A block, if any.
                    properties:
                      race_id: { type: string }
                      week: { type: integer }
                      of: { type: integer }
                  weeks:
                    type: array
                    items:
                      type: object
                      properties:
                        week_start: { type: string, format: date }
                        tss: { type: [integer, "null"] }
                        tss_races: { type: [integer, "null"] }
                        run_km: { type: [number, "null"] }
                        run_moving_s: { type: [integer, "null"] }
                        run_count: { type: [integer, "null"] }
                        run_avg_pace_s_per_km: { type: [number, "null"] }
                        run_long_km: { type: [number, "null"], description: Longest non-race run that week. }
                        run_long_pace_s_per_km: { type: [number, "null"], description: That longest run's own average pace. }
                        run_tss: { type: [integer, "null"], description: TSS from runs only (part of tss). }
                        ride_km: { type: [number, "null"] }
                        ride_moving_s: { type: [integer, "null"] }
                        ride_count: { type: [integer, "null"] }
                        ride_avg_power_w: { type: [integer, "null"], description: Time-weighted average. }
                        ride_long_km: { type: [number, "null"] }
                        ride_tss: { type: [integer, "null"], description: TSS from rides only (part of tss). }
                        hours: { type: [number, "null"] }
                        sessions: { type: [integer, "null"] }
                        ctl: { type: [number, "null"] }
                        atl: { type: [number, "null"] }
                        planned:
                          type: boolean
                          description: True for a future week - its values come from scheduled workouts, or are all null if nothing's scheduled yet.
                        races:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                              priority: { type: string, enum: [A, B, C] }
                              result_s: { type: [integer, "null"] }
                  race_day_form:
                    type: object
                    description: A races only.
                    properties:
                      ctl: { type: number }
                      atl: { type: [number, "null"] }
                      tsb: { type: [number, "null"] }
                      band: { type: [string, "null"], enum: [very_fresh, fresh, neutral, fatigued] }
                      projected: { type: boolean, description: True when the race is still upcoming. }
                      insufficient_data: { type: boolean, description: True when an upcoming race has nothing scheduled yet to project from. }
                  comparison:
                    type: [object, "null"]
                    description: A races only - the most recent earlier A race at the same distance (within 2%), aligned counting back from race day.
                    properties:
                      race_id: { type: string }
                      weeks:
                        type: array
                        items:
                          type: object
                          description: Same shape as `weeks` above.
                  prediction:
                    type: [object, "null"]
                    description: A run-race blocks only - the fastest Riegel prediction from a completed B/C race in the block.
                    properties:
                      time_s: { type: integer }
                      from_race_id: { type: string }
                  key_sessions:
                    type: object
                    description: >
                      `items` holds every candidate session found in the block/window, sorted by
                      date - it is not trimmed by the athlete's race_key_session_cap preference
                      (that preference is a frontend-only paging size; the client paginates this
                      array itself). `total_candidates` always equals `items.length`.
                    properties:
                      total_candidates: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            name: { type: string }
                            activity_id: { type: [string, "null"] }
                            scheduled_workout_id: { type: [string, "null"] }
                            reason: { type: string, enum: [race, tagged, long, quality, best_effort, planned] }
                            label: { type: string }
                            km: { type: [number, "null"] }
                            tss: { type: [integer, "null"] }
                            sport:
                              type: [string, "null"]
                              enum: [bike, run, swim, walk, multisport, transition, null]
                              description: >
                                The candidate's own sport (the underlying race/activity/workout's
                                sport), independent of the race's own sport - lets the frontend
                                offer a sport filter alongside the reason filter. Null only for a
                                race candidate whose own sport was never set.
                  durability:
                    type: [object, "null"]
                    description: A races (run or bike) only.
                    properties:
                      sport: { type: string, enum: [ride, run] }
                      current: { $ref: "#/components/schemas/DurabilitySportSection" }
                      comparison: { $ref: "#/components/schemas/DurabilitySportSection" }
                  sweat_rate_l_per_h: { type: number }
                  sweat_rate_source: { type: string, enum: [measured, default] }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/races/{id}/splits:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Splits for a race's linked activity
      operationId: getRaceSplits
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [laps, "1", "5", elevation], default: laps }
          description: >
            Manual laps, fixed 1km/5km splits, or (elevation) one split per flat/climb/descent
            section of the race's linked course. elevation falls back to the normal empty shape
            (splits: [], has_laps: false) when the race has no course, or the course's elevation
            isn't ok - the frontend only offers this mode when the course already has sections.
      responses:
        "200":
          description: Splits against the goal pace (or average pace, if there's no goal).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceSplits"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Races]
      summary: Custom splits for a race's linked activity, from your own list of steps
      operationId: getRaceCustomSplits
      description: >
        Like GET on this same path, but splits come from `steps` instead of a fixed mode - e.g.
        "the first mile, then every 2km after that". See CustomSplitStep for how steps are
        consumed. Each split's delta is against the race's own goal pace/target power (or its
        activity's average, if there's no goal/target), same as every other mode.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomSplitsRequest" }
      responses:
        "200":
          description: Splits against the goal pace (or average pace, if there's no goal) - same response shape as GET on this path.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_laps: { type: boolean, description: Always false - custom splits have no laps mode. }
                  ref: { type: string, enum: [goal, average] }
                  ref_pace_s_per_km: { type: [number, "null"] }
                  ref_power: { type: string, enum: [target, average] }
                  ref_power_w: { type: [integer, "null"] }
                  halves:
                    type: [object, "null"]
                    properties:
                      first_s: { type: integer }
                      second_s: { type: integer }
                  splits:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: [string, "null"] }
                        start_km: { type: number }
                        end_km: { type: number }
                        time_s: { type: integer }
                        pace_s_per_km: { type: [number, "null"] }
                        gap_pace_s_per_km: { type: [number, "null"] }
                        avg_hr: { type: [integer, "null"] }
                        avg_power: { type: [integer, "null"] }
                        delta_vs_ref_s_per_km: { type: [number, "null"] }
                        delta_power_w: { type: [integer, "null"] }
                        section_type:
                          type: [string, "null"]
                          enum: [steep_descent, descent, flat, climb, steep_climb, null]
                          description: Always null - no course/elevation section here.
                        gain_m: { type: [integer, "null"], description: Always null. }
                        loss_m: { type: [integer, "null"], description: Always null. }
                        avg_grade_pct: { type: [number, "null"] }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/races/{id}/weather:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Race-day weather forecast
      operationId: getRaceWeather
      description: >
        From Open-Meteo, resolved via the race's course start point. `available` is false (every
        other field null) when the race has no course, the course has no resolved start point,
        the race is more than 10 days out (or in the past), or the upstream call failed - this is
        a normal 200, never an error, since weather is a nice-to-have on the race page.
      responses:
        "200":
          description: Forecast, or an unavailable response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceWeather"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/races/{id}:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Read a public race
      operationId: getPublicRace
      security: []
      description: >
        Unauthenticated, read-only view of a race whose owner has set `is_public`
        (PATCH /v1/races/{id}). Returns 404 for a private race exactly as for a missing
        one. Deliberately a narrow allowlist of fields - see PublicRace.
      responses:
        "200":
          description: The public race.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicRace" }
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/races/{id}/splits:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Splits for a public race
      operationId: getPublicRaceSplits
      security: []
      description: >
        Unauthenticated equivalent of GET /v1/races/{id}/splits for a race whose owner
        has set `is_public` - same modes and response. Custom splits (POST) stay
        authenticated-only. Returns 404 for a private race exactly as for a missing one.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [laps, "1", "5", elevation], default: laps }
      responses:
        "200":
          description: Splits against the goal pace (or average pace, if there's no goal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceSplits" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/races/{id}/weather:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: Race-day weather forecast for a public race
      operationId: getPublicRaceWeather
      security: []
      description: >
        Unauthenticated equivalent of GET /v1/races/{id}/weather for a race whose owner
        has set `is_public`. Returns 404 for a private race exactly as for a missing one.
      responses:
        "200":
          description: Forecast, or an unavailable response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceWeather" }
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/races/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/RaceId"
    get:
      tags: [Races]
      summary: List a race's comments
      operationId: listRaceComments
      description: Same self-or-coach-with-grant permission as the race itself (unlike activity comments, not open to a read-only viewer share). Oldest first.
      responses:
        "200":
          description: Comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RaceComment"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Races]
      summary: Comment on a race plan
      operationId: createRaceComment
      description: "`role` is resolved server-side from the poster's relationship to the athlete at post time, and stored - not recomputed later."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                week: { type: integer, description: Pins the comment to a training-block week. }
                parent_id: { type: string, description: Reply to a top-level comment - only one level of threading is allowed. }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RaceComment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/races/{id}/comments/{comment_id}:
    parameters:
      - $ref: "#/components/parameters/RaceId"
      - name: comment_id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Races]
      summary: Delete a race comment
      operationId: deleteRaceComment
      description: Only the comment's own author may delete it.
      responses:
        "204":
          description: Comment deleted.
        "403":
          description: Not the comment's author.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/courses:
    get:
      tags: [Courses]
      summary: List or search courses
      operationId: listCourses
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Matches against name and location_name.
      responses:
        "200":
          description: Courses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CourseSummary" }
    post:
      tags: [Courses]
      summary: Upload a GPX course
      operationId: uploadCourse
      description: >
        Parses the track synchronously (distance, smoothed elevation gain/loss,
        climbs, a simplified route polyline, and a resampled elevation profile) -
        the response is exactly what gets saved, including the reverse-geocoded
        `location_name` (editable afterwards).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [gpx, name]
              properties:
                gpx: { type: string, format: binary }
                name: { type: string }
                location_name: { type: string, description: Overrides the reverse-geocoded default. }
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/courses/from-activity:
    post:
      tags: [Courses]
      summary: Build a course from an activity's GPS track
      operationId: createCourseFromActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, name]
              properties:
                activity_id: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Course created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/courses/{id}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      summary: Retrieve a course
      operationId: getCourse
      description: >
        Sections and climbs are calculated on this request from the course's stored elevation,
        with the owning athlete's course_section_settings. Any of the optional query parameters
        below (named like CourseSectionSettings' fields) override those settings for this
        response only - a live preview that saves nothing. A course from before sections existed
        has its elevation series built from its GPX or source activity on first read.
      parameters:
        - { name: algorithm, in: query, required: false, schema: { type: string, enum: [douglas_peucker, bottom_up] } }
        - { name: flat_max_pct, in: query, required: false, schema: { type: number } }
        - { name: steep_min_pct, in: query, required: false, schema: { type: number } }
        - { name: fit_tolerance_m, in: query, required: false, schema: { type: number } }
        - { name: min_section_m, in: query, required: false, schema: { type: number } }
        - { name: keep_min_rise_m, in: query, required: false, schema: { type: number } }
        - { name: spike_window_m, in: query, required: false, schema: { type: number } }
        - { name: smoothing_window_m, in: query, required: false, schema: { type: number } }
        - { name: resample_step_m, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Course, including its route, elevation profile, sections, climbs and race history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Courses]
      summary: Rename a course or edit its location
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location_name: { type: string }
      responses:
        "200":
          description: Updated course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Courses]
      summary: Delete a course
      operationId: deleteCourse
      description: Races linked to this course have their course_id cleared, not deleted.
      responses:
        "204":
          description: Course deleted.
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/courses/{id}/gpx:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      summary: Download a course's GPX
      operationId: downloadCourseGpx
      description: The original uploaded file, or a GPX regenerated from the stored route when the course came from an activity (source=activity).
      responses:
        "200":
          description: A .gpx file.
          content:
            application/gpx+xml:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/courses/{id}/recompute-elevation:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Courses]
      summary: Rebuild a course's stored elevation series
      operationId: recomputeCourseElevation
      description: >
        Rebuilds the stored elevation series from the course's GPX file, or its source activity
        when there's no file. Only needed after the source data or the resampling code changes -
        every section setting applies at read time, so changing settings never needs this.
      responses:
        "200":
          description: The course, with sections from the rebuilt series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The course's GPX file and source activity are both gone.

  /v1/athletes/{id}/recompute-elevation:
    parameters:
      - $ref: "#/components/parameters/AthleteId"
    post:
      tags: [Courses]
      summary: Rebuild the elevation series of every one of an athlete's courses
      operationId: recomputeAthleteCourseElevation
      description: >
        POST /v1/courses/{id}/recompute-elevation for each course, one at a time. Synchronous - an
        athlete has tens of courses at most and each takes milliseconds.
      responses:
        "200":
          description: How many courses were rebuilt, and how many were skipped because their source data is gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  skipped: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Webhooks]
      summary: Delete a subscription
      operationId: deleteWebhook
      description: Stops delivery and removes the webhook subscription.
      responses:
        "204":
          description: Subscription removed.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/garmin/connection:
    get:
      tags: [Garmin]
      summary: Get the Garmin link
      operationId: getGarminConnection
      description: >
        The caller's Garmin Connect link, or `connected: false` if none. The API key is
        write-only and never returned.
      responses:
        "200":
          description: Link status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
    put:
      tags: [Garmin]
      summary: Save the Garmin link
      operationId: saveGarminConnection
      description: >
        Creates or updates the link. `api_key` is a Garmin Personal API key (created at
        connect.garmin.com/app/settings/personalApiToken); it is required the first time and
        optional afterwards - omit it to edit the email or expiry without replacing the stored
        key. It is encrypted at rest (AES-256-GCM). `email` is the Garmin account's email and
        defaults to the caller's own login email. `key_expires_on` is the date the key expires
        (Garmin issues them for 30/90/180/365 days but does not expose it); only `api_key`
        is preserved when omitted, so omitting `key_expires_on` clears it. `sync_limit` is how
        many activities one sync pulls (1-100, default 50); it is left unchanged when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, minLength: 8, maxLength: 512, writeOnly: true }
                email: { type: string, format: email, maxLength: 320 }
                key_expires_on: { type: string, format: date, nullable: true }
                sync_limit: { type: integer, minimum: 1, maximum: 100, description: Most activities one sync pulls. Defaults to 50. }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarminConnection"
        "400":
          description: No key on first save, a malformed field, or an expiry date in the past.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Garmin key storage is not configured on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Garmin]
      summary: Remove the Garmin link
      operationId: deleteGarminConnection
      description: Deletes the stored key and link. Already-imported activities are kept.
      responses:
        "204":
          description: Removed (also returned when there was no link).

  /v1/garmin/sync:
    post:
      tags: [Garmin]
      summary: Pull activities from Garmin Connect
      operationId: syncGarmin
      description: >
        Pulls the caller's activities from Garmin Connect using the stored Personal API key
        and feeds them through the same pipeline as `POST /v1/activities/batch`, so identical
        files and metadata-only stub files are handled identically. Every Garmin activity id
        pulled is remembered per athlete and skipped (before downloading) on later syncs, so an
        activity you delete in Cadence, or edit in Garmin Connect, is not re-imported. Activities are taken
        **oldest first** within the window, at most `limit` per call, so repeated syncs work
        steadily through a backlog; `truncated: true` means more remain - call again. The
        window starts the day after the last sync (30 days back the first time) unless `since`
        is given. `last_synced_at` only advances when every download succeeded.


        Returns `202 Accepted`; poll `batch` via `GET /v1/uploads/batches/{id}` (its `Location`)
        until it settles. `batch` is null when there was nothing new to import.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: >
                    Most activities to import this run. Defaults to the caller's saved
                    `sync_limit` (50 unless changed); never above 100.
                since: { type: string, format: date, description: Start of the window; not in the future. }
                latest:
                  type: boolean
                  description: >
                    Sync only Garmin's single newest activity (ignores `limit` and `since`, and
                    does not move the sync window, so older activities are still picked up by a
                    normal sync). Skipped, like any sync, if that activity was already pulled.
                weight_before_kg: { type: number, format: float, description: "Only with `latest`. As for a single-file upload." }
                weight_after_kg: { type: number, format: float, description: "Only with `latest`." }
                fluids_ml: { type: integer, description: "Only with `latest`." }
                shoe_id: { type: string, description: "Only with `latest`. Shoe worn (run activities); an unknown id is a 400." }
      responses:
        "202":
          description: Sync accepted.
          headers:
            Location:
              description: URL of the batch job to poll (absent when `batch` is null).
              schema: { type: string, example: /v1/uploads/batches/bat_3Yc1Qd }
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [garmin_sync] }
                  id: { type: string, description: The recorded sync run (see `GET /v1/garmin/syncs`). }
                  found: { type: integer, description: Activities Garmin has in the window. }
                  already_synced: { type: integer, description: Of those, how many an earlier sync already pulled (skipped without downloading). }
                  requested: { type: integer, description: How many this run tried to import. }
                  failed: { type: integer, description: Activities that could not be downloaded. }
                  truncated: { type: boolean, description: More remain in the window beyond this run. }
                  batch:
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/UploadBatch"
        "400":
          description: "`limit` outside 1..100, `since` in the future, session details without `latest`, or an unknown `shoe_id`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No Garmin connection is saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The saved key's expiry date has passed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Garmin rejected the key (expired or revoked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Garmin could not be reached, or every download failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/garmin/syncs:
    get:
      tags: [Garmin]
      summary: Recent Garmin sync runs
      operationId: listGarminSyncs
      description: >
        The caller's most recent sync attempts, newest first, including failed ones. The last
        50 are kept.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/GarminSyncRun"

  /v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List subscriptions
      operationId: listWebhooks
      description: All active webhook subscriptions for the app.
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"
    post:
      tags: [Webhooks]
      summary: Create a subscription
      operationId: createWebhook
      description: >
        Registers a callback URL for events. Cadence POSTs a signed payload when the
        event fires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items:
                    type: string
                  example: [activity.created, scheduled_workout.matched]
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.cadence.cc/oauth/authorize
          tokenUrl: https://api.cadence.cc/oauth/token
          scopes:
            activities:read: Read activities and streams
            activities:write: Upload and edit activities
            workouts:write: Create and edit workouts
            calendar:write: Schedule workouts
            coach: Access an athlete roster
            gear:write: Manage gear
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ActivityId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AthleteId:
      name: id
      in: path
      required: true
      schema: { type: string }
    RaceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    CourseId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: invalid_request
              code: unknown_field
              message: "Unknown field 'paec' in query."
              param: q
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token's subject may not act on this athlete.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: forbidden
              code: not_on_roster
              message: "Coach coach_mara has no roster relationship with athlete ath_sofia."
              param: athlete_id
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: The uploaded file could not be processed (too small, too large, or unparseable).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              type: invalid_request_error
              code: unprocessable_entity
              message: "GPX file has fewer than 50 usable track points."
              param: gpx

  schemas:
    GarminConnection:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        email: { type: string, format: email, nullable: true }
        key_expires_on: { type: string, format: date, nullable: true }
        sync_limit: { type: integer, minimum: 1, maximum: 100, nullable: true, description: Most activities one sync pulls (null when not connected). }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: The sync window marker (where the next sync resumes), not when a sync last ran.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When a sync last ran, successful or not.
        last_activity:
          nullable: true
          description: The newest Garmin activity ever pulled, by its start time.
          type: object
          properties:
            garmin_activity_id: { type: integer, format: int64 }
            start_time: { type: string, format: date-time }
    GarminSyncRun:
      type: object
      description: >
        One past sync attempt. `batch` and each activity's `upload_status`, `activity_id`,
        `name` and `sport` are read live, so a run still being processed settles in place; they
        are null once the batch or activity has since been deleted (the Garmin id and start time
        are always present). `error` is set when the attempt failed (never contains the key).
      properties:
        id: { type: string, example: gsr_8Zq2Lm }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        found: { type: integer }
        already_synced: { type: integer }
        requested: { type: integer }
        failed: { type: integer }
        truncated: { type: boolean }
        error: { type: string, nullable: true }
        batch:
          type: object
          nullable: true
          properties:
            id: { type: string }
            status: { type: string }
            counts: { type: object }
        activities:
          type: array
          description: Oldest first.
          items:
            type: object
            properties:
              garmin_activity_id: { type: integer, format: int64 }
              start_time: { type: string, format: date-time }
              upload_status: { type: string, nullable: true }
              activity_id: { type: string, nullable: true }
              name: { type: string, nullable: true }
              sport: { type: string, nullable: true }

    Sport:
      type: string
      enum: [bike, run, swim, walk, multisport, transition]
      description: >
        `multisport` and `transition` only occur on activities created by importing
        a multisport FIT file (e.g. a duathlon): the parent activity spanning the
        whole session is `multisport`, and the changeover legs between sports are
        `transition`. Workouts cannot be designed with either.
    TimeOfDay:
      type: string
      enum: [AM, MID, PM]

    CustomSplitStep:
      type: object
      required: [end_type]
      properties:
        end_type: { type: string, enum: [time, distance] }
        duration_s: { type: integer, description: Seconds - required for end_type=time. }
        distance_km: { type: number, description: Kilometres - required for end_type=distance. }
        label: { type: [string, "null"], description: "e.g. \"Mile 1\" - shown as this split's label instead of the default." }
      description: >
        One step of a custom splits request (POST /v1/activities/{id}/splits or
        /v1/races/{id}/splits). Steps are consumed in order from the start of the recording, each
        picking up where the previous one left off, so they can never overlap or be out of order
        by construction - a step with no recording left to consume (the recording ended early) is
        just dropped, and any recording left over after the last step becomes one unlabeled
        trailing split.

    CustomSplitsRequest:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CustomSplitStep" }

    List:
      type: object
      properties:
        object: { type: string, const: list }
        has_more: { type: boolean }
        next_cursor: { type: [string, "null"] }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            param: { type: [string, "null"] }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string, example: cad_at_9f2a7c }
        refresh_token: { type: string, example: cad_rt_1be40d }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 21600 }
        scope: { type: string, example: "activities:read activities:write" }

    JwtToken:
      type: object
      properties:
        token:
          type: string
          description: "The signed RS256 bearer JWT. Send as `Authorization: Bearer <token>`."
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij8wMSJ9.eyJzdWIiOiJhdGhfbmVpbCJ9.SflKxw…
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        claims:
          $ref: "#/components/schemas/JwtClaims"

    JwtClaims:
      type: object
      description: >
        The decoded payload. `sub` is the authenticated principal; the API authorizes
        every request by checking `sub` may act on `athlete_id`.
      properties:
        iss: { type: string, example: https://api.cadence.cc }
        sub: { type: string, description: The authenticated principal (athlete or coach)., example: coach_mara }
        athlete_id: { type: string, description: The athlete whose data this token authorizes., example: ath_neil }
        aud: { type: string, example: cadence-api }
        scope: { type: string, example: "activities:read activities:write" }
        iat: { type: integer, example: 1750000000 }
        exp: { type: integer, example: 1750003600 }
        jti: { type: string, example: jwt_4f9c2a }

    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: RSA }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              kid: { type: string, example: "801" }
              n: { type: string, example: 0vx7agoebGcQSuu… }
              e: { type: string, example: AQAB }

    User:
      type: object
      properties:
        id: { type: string, example: usr_neil }
        name: { type: string, example: Neil Goodgame }
        email: { type: string, example: neil@example.cc }
        email_verified:
          type: boolean
          description: >
            True immediately for social signups (the provider already verified the
            address). False for a password signup until they redeem the link sent by
            POST /v1/auth/register, or resend one via POST /v1/auth/resend-verification.
          example: true
        age: { type: integer, example: 34 }
        weight_kg: { type: number, example: 72 }
        ftp: { type: integer, example: 265 }
        critical_run_power: { type: integer, example: 285 }
        running_power_source:
          type: string
          enum: [stryd, native]
          default: stryd
          description: >-
            Which running-power reading to trust when a FIT file carries both a watch's own
            native estimate (e.g. Garmin Running Power) and a Stryd footpod reading - native
            algorithms tend to read meaningfully higher than Stryd for the same effort, so the
            non-selected source is completely ignored, not used as a fallback.
          example: stryd
        threshold_pace: { type: string, example: "4:00" }
        threshold_window_days:
          type: integer
          default: 112
          description: >
            Trailing window (days) a threshold's best qualifying effort must fall
            within to count - see GET /v1/athletes/{id}/thresholds. Default 112 (16
            weeks).
          example: 112
        threshold_sanity_pct:
          type: integer
          default: 30
          description: >
            Per-candidate outlier filter - an effort implying more than this %
            deviation from the then-current value is excluded (e.g. corrupt
            power-meter data).
          example: 30
        threshold_warning_days:
          type: integer
          enum: [14, 21, 28, 0]
          default: 21
          description: >
            How many days before a threshold's current source activity ages out of
            threshold_window_days the Threshold suggestions feature (GET
            /v1/athletes/{id}/threshold-suggestions) warns the athlete. 0 = off.
            Scaled down for threshold_window_days < 84 (a quarter of the window is
            used instead of this raw setting).
          example: 21
        decoupling_vi_limit_bike:
          type: number
          default: 1.06
          description: Aerobic decoupling qualification - max variability index (NP ÷ avg power) for a bike session's steady window. Read at compute time (ingest/recompute); not retroactive.
          example: 1.06
        decoupling_vi_limit_run:
          type: number
          default: 1.04
          description: Same as decoupling_vi_limit_bike, for run sessions.
          example: 1.04
        decoupling_if_limit:
          type: number
          default: 0.85
          description: Aerobic decoupling qualification - max intensity factor (NP ÷ FTP/CP) for a session's steady window. Read at compute time; not retroactive.
          example: 0.85
        decoupling_min_steady_minutes:
          type: integer
          default: 60
          description: Aerobic decoupling qualification - minimum moving time (minutes) in the steady window, after the warm-up trim (decoupling_warmup_minutes, or a matched workout's own warmup step - see decoupling_use_workout_warmup). Read at compute time; not retroactive.
          example: 60
        decoupling_warmup_minutes:
          type: integer
          default: 5
          description: Minutes trimmed off the start of the recording before the steady window is measured. Overridden per-activity by decoupling_use_workout_warmup when it applies. Read at compute time; not retroactive.
          example: 5
        decoupling_use_workout_warmup:
          type: boolean
          default: false
          description: When true, an activity matched to a designed workout whose first step is a warmup with a known (time-based) duration trims exactly that duration instead of decoupling_warmup_minutes. Falls back to decoupling_warmup_minutes when unmatched, or the matched workout has no warmup step.
          example: false
        decoupling_warm_air_temp:
          type: number
          default: 25.0
          description: Aerobic decoupling heat-confound "warm" flag - triggers if avg air °C over the steady window is at or above this, OR decoupling_warm_skin_temp is met. Read at compute time; not retroactive.
          example: 25.0
        decoupling_warm_skin_temp:
          type: number
          default: 33.0
          description: Aerobic decoupling heat-confound "warm" flag - triggers if avg skin °C over the steady window is at or above this, OR decoupling_warm_air_temp is met.
          example: 33.0
        decoupling_hot_air_temp:
          type: number
          default: 30.0
          description: Aerobic decoupling heat-confound "hot" flag - triggers if avg air °C over the steady window is at or above this, OR decoupling_hot_skin_temp is met.
          example: 30.0
        decoupling_hot_skin_temp:
          type: number
          default: 34.0
          description: Aerobic decoupling heat-confound "hot" flag - triggers if avg skin °C over the steady window is at or above this, OR decoupling_hot_air_temp is met.
          example: 34.0
        lthr: { type: integer, example: 155 }
        max_hr: { type: integer, example: 186 }
        resting_hr:
          type: [integer, "null"]
          description: Optional. Only used for the Karvonen heart-rate-reserve % shown on Activity Analysis's Stats tab.
          example: 48
        is_coach:
          type: boolean
          description: Whether this user also coaches other users. A user can train and coach at once.
          example: true
        race_block_weeks:
          type: integer
          enum: [12, 16, 20, 24]
          default: 16
          description: >
            The last-resort fallback for an A race's training-block length (see
            GET /v1/races/{id}/block): used only when that race has no explicit
            block_weeks_requested of its own and no matching entry in
            race_block_week_defaults. A standalone B/C race (no resolved parent) gets a fixed
            5-week window regardless of this setting; a B/C race inside an upcoming A race's
            block inherits that A block's start, which this setting does govern.
          example: 16
        race_block_week_defaults:
          type: object
          description: >
            Per-distance-bucket training-block-length defaults, keyed by "5k", "10k", "10mi",
            "half", "marathon" or "ultra" - pre-fills a new A race's block length based on its
            own distance (matched within 2%), ahead of the flat race_block_weeks fallback
            above. A missing key falls back to race_block_weeks.
          additionalProperties: { type: integer }
          example: { "5k": 8, "10k": 10, "10mi": 12, "half": 12, "marathon": 16, "ultra": 20 }
        race_key_session_cap:
          type: integer
          enum: [6, 8, 10, 12, 15, 20]
          default: 10
          description: Frontend-only paging size for the key sessions list on a race's page - GET /v1/races/{id}/block's key_sessions.items always returns every candidate found (unpaginated); this preference isn't read by either backend.
          example: 10
        course_section_settings:
          $ref: "#/components/schemas/CourseSectionSettings"

    Athlete:
      allOf:
        - $ref: "#/components/schemas/User"
      description: Deprecated alias of User, kept for compatibility.

    UserRelationship:
      type: object
      description: >
        A grant from one user (owner) to another (grantee). A viewer can see the
        owner's activities and analysis; a coach can additionally schedule and
        assign workouts.
      properties:
        id: { type: string, example: rel_88 }
        owner_user_id: { type: string, example: usr_neil }
        grantee_user_id: { type: string, example: usr_mara }
        role: { type: string, enum: [viewer, coach], example: coach }
        status: { type: string, enum: [pending, active], example: active }
        compliance: { type: number, example: 0.92 }
        tsb: { type: integer, example: -8 }

    CoachedAthlete:
      type: object
      description: A coaching context — an athlete the signed-in user coaches.
      properties:
        relationship_id: { type: string, example: rel_88 }
        user_id: { type: string, example: usr_sofia }
        name: { type: string, example: Sofia Greco }
        role: { type: string, enum: [coach, viewer], example: coach }
        compliance: { type: number, example: 0.92 }
        tsb: { type: integer, example: -8 }
        last_activity_at: { type: string, format: date-time }

    AthleteOld:
      type: object
      properties:
        id: { type: string, example: ath_neil }
        name: { type: string, example: Neil Goodgame }
        age: { type: integer, example: 34 }
        ftp: { type: integer, example: 265 }
        critical_run_power: { type: integer, example: 285 }
        threshold_pace: { type: string, example: "4:00" }
        lthr: { type: integer, example: 155 }
        max_hr: { type: integer, example: 186 }
        coach_id: { type: [string, "null"] }
        role: { type: string, enum: [athlete, coach], example: athlete }

    Activity:
      type: object
      properties:
        id: { type: string, example: act_9f2a7c }
        athlete_id: { type: string }
        sport: { $ref: "#/components/schemas/Sport" }
        environment:
          type: string
          enum: [outdoor, indoor]
          description: >
            `indoor` for treadmill / trainer sessions, which have no GPS track.
            Determines whether route and position streams are present.
          example: outdoor
        has_gps:
          type: boolean
          description: Whether the activity has a GPS position track. Always false when environment is indoor.
          example: true
        name: { type: string, example: Sunday Long Run }
        start_date: { type: string, format: date-time }
        source: { type: string, example: Garmin }
        device:
          type: string
          description: >
            Recording device from the uploaded file's metadata (the FIT `file_id`
            manufacturer/product), e.g. `Zwift` or `Garmin Edge 830`. Captured at
            import; empty when the format doesn't carry it (GPX/TCX) or the
            manufacturer is unknown.
          example: Zwift
        moving_time: { type: integer, description: Seconds, example: 6510 }
        distance_km: { type: number, example: 23.0 }
        distance_source:
          type: string
          enum: [gps, footpod, trainer, manual]
          description: How distance was measured. `footpod` / `trainer` for indoor runs and rides.
          example: gps
        power_source:
          type: [string, "null"]
          enum: [stryd, native, null]
          description: >-
            Which of the two candidate running-power readings this run's power was actually
            resolved from (native vs Stryd) - null for every non-FIT/non-run activity, where
            there's no such ambiguity to record. See the athlete's running_power_source
            preference.
          example: stryd
        avg_power: { type: [integer, "null"] }
        norm_power: { type: [integer, "null"] }
        intensity: { type: number, description: Intensity factor, example: 0.78 }
        tss: { type: integer, example: 96 }
        avg_hr: { type: integer, example: 138 }
        max_hr: { type: integer }
        ascent: { type: integer, description: Metres }
        max_power: { type: [integer, "null"] }
        avg_cadence: { type: [integer, "null"] }
        max_cadence: { type: [integer, "null"] }
        max_speed: { type: [number, "null"], description: km/h }
        total_descent: { type: [integer, "null"], description: Metres }
        elevation_min: { type: [integer, "null"], description: Metres }
        elevation_max: { type: [integer, "null"], description: Metres }
        calories:
          type: [integer, "null"]
          description: >
            Power-based estimate only (work_kJ / 0.24, a standard cycling efficiency
            approximation). Null for activities with no power data.
          example: 850
        trimp:
          type: [number, "null"]
          description: >
            Edwards' TRIMP - sum over HR zones of (minutes in zone * zone number
            1-5). Null unless the athlete has an HR threshold set (lthr) and the
            activity has a heart rate stream.
          example: 142.5
        avg_left_balance_pct:
          type: [number, "null"]
          description: >
            Mean % of power from the left leg, from a dual-sided/balance-capable
            power meter's left_right_balance field. Right % is 100 minus this.
            Null for everything else (most activities).
          example: 51.2
        start_weight_kg:
          type: [number, "null"]
          description: Body weight before the session. Defaults to the user's profile weight if unset.
          example: 72.4
        end_weight_kg:
          type: [number, "null"]
          description: Body weight after the session (for sweat-loss estimates).
          example: 71.1
        fluids_ml:
          type: [integer, "null"]
          description: Fluids consumed during the session.
          example: 750
        avg_air_temp:
          type: [number, "null"]
          description: >
            Mean air temperature (°C) computed from the record stream. Run only;
            null unless a Stryd footpod supplied environmental data.
          example: 21.5
        avg_humidity:
          type: [integer, "null"]
          description: >
            Mean relative humidity (% RH) computed from the record stream. Run only;
            null unless Stryd environmental data is present.
          example: 57
        aerobic_training_effect:
          type: [number, "null"]
          description: >
            Garmin's Firstbeat-derived aerobic training load, 0.0-5.0. From the FIT
            session message (no GPX/TCX equivalent), so null for activities not
            uploaded as .fit or from devices/platforms that don't compute it - also
            editable via PATCH (see updateActivity) for exactly that case, e.g. a
            Zwift-originated file whose downloadable FIT never carries Garmin
            Connect's own better cloud-computed value.
          example: 4.2
        anaerobic_training_effect:
          type: [number, "null"]
          description: Garmin's Firstbeat-derived anaerobic training load, 0.0-5.0. Same source/availability/editability as aerobic_training_effect.
          example: 0.0
        training_effect_label:
          type: string
          description: >
            Benefit label derived from aerobic_training_effect (e.g. "Improving",
            "Overreaching"). Empty string when aerobic_training_effect is null.
          example: Highly Improving
        decoupling_pct:
          type: [number, "null"]
          description: >
            Aerobic decoupling (Pw:HR) - the drop in efficiency (power/HR) from the first
            to the second half of the steady window. Null when decoupling_qualified is
            false - not computed, not just hidden.
          example: 5.4
        ef_first: { type: [number, "null"], description: "W/bpm, first half. Null when not qualified." }
        ef_second: { type: [number, "null"], description: "W/bpm, second half. Null when not qualified." }
        steady_seconds:
          type: [integer, "null"]
          description: Moving time in the scored window (after the 10-min warm-up). Populated whenever there's a steady window to measure, qualified or not.
          example: 4860
        decoupling_qualified: { type: boolean, default: false }
        decoupling_reasons:
          type: array
          items: { type: string, enum: [sport, no_power, variable, intensity, short, hr_coverage, power_coverage, no_threshold] }
          description: Every failing qualification check, not just the first. Empty when qualified.
          example: []
        decoupling_vi:
          type: [number, "null"]
          description: Variability index (NP / avg power, steady window). Shown in the checks row even when not qualified.
          example: 1.04
        decoupling_if:
          type: [number, "null"]
          description: Intensity factor (NP / FTP or CP at the activity's date).
          example: 0.74
        decoupling_avg_temp: { type: [number, "null"], description: "Mean air °C over the steady window." }
        decoupling_avg_core: { type: [number, "null"], description: "Mean core °C over the steady window (CORE sensor, where present) - informational only, doesn't gate decoupling_warm/decoupling_hot (see those fields)." }
        decoupling_avg_skin: { type: [number, "null"], description: "Mean skin °C over the steady window (CORE sensor, where present)." }
        decoupling_warm:
          type: boolean
          default: false
          description: avg air temp >= athlete's decoupling_warm_air_temp OR avg skin temp >= decoupling_warm_skin_temp. Marked, not excluded from scoring.
        decoupling_hot:
          type: boolean
          default: false
          description: avg air temp >= athlete's decoupling_hot_air_temp OR avg skin temp >= decoupling_hot_skin_temp. Marked, not excluded from scoring.
        decoupling_hr_coverage_pct:
          type: [number, "null"]
          description: "% of steady-window samples with a non-null HR reading, 0-100. Populated whenever there's a steady window, qualified or not."
          example: 100
        decoupling_power_coverage_pct:
          type: [number, "null"]
          description: "% of steady-window samples with a non-null power reading, 0-100."
          example: 100
        decoupling_halves:
          type: array
          description: One entry per half (empty when not qualified).
          items:
            type: object
            properties:
              start_s: { type: integer }
              end_s: { type: integer }
              power: { type: [integer, "null"] }
              hr: { type: [integer, "null"] }
              ef: { type: [number, "null"], description: W/bpm }
        durability:
          type: array
          description: This activity's own ActivityDurability rows, for the Stats card's durability strip.
          items: { $ref: "#/components/schemas/ActivityDurabilityRow" }
        tags:
          type: array
          items: { type: string }
          example: [Endurance, Race]
        workout_id: { type: [string, "null"], example: wkt_long_z2 }
        bike_id: { type: [string, "null"] }
        shoe_id: { type: [string, "null"], example: shoe_vf3 }
        parent_activity_id:
          type: [string, "null"]
          description: >
            Set on each leg of a multisport activity, pointing at the parent
            `multisport` activity it belongs to. Null everywhere else. Legs are
            excluded from activity lists, calendar unplanned activities, and
            fitness aggregation — reach them via the parent's child_activity_ids.
        child_activity_ids:
          type: array
          items: { type: string }
          description: >
            For a `multisport` activity, the ids of its per-leg child activities
            (including transitions) in start order. Empty for every other sport.
          example: []
        primary_activity_id:
          type: [string, "null"]
          description: >
            Set on a duplicate recording of another activity (e.g. the same ride
            captured by both Zwift and a head unit), pointing at the designated
            primary. Null everywhere else. Duplicates are excluded from activity
            lists, calendar unplanned activities, and fitness aggregation — only
            the primary counts toward training load. Set or clear it via
            PATCH /v1/activities/{id}; the primary must belong to the same
            athlete, must not itself be a duplicate, and multisport parents/legs
            cannot take part.
        duplicate_activity_ids:
          type: array
          items: { type: string }
          description: >
            The ids of duplicate recordings linked to this activity, in start
            order. Empty unless this activity is the primary of a duplicate group.
          example: []

    RaceSplits:
      description: GET /v1/races/{id}/splits, and its public equivalent.
      type: object
      properties:
        has_laps: { type: boolean, description: False when mode=laps and the activity has one lap or none. }
        ref: { type: string, enum: [goal, average] }
        ref_pace_s_per_km: { type: [number, "null"] }
        ref_power: { type: string, enum: [target, average], description: Mirrors ref/ref_pace_s_per_km - "target" when the race has target_power set, else "average" (the activity's own average power). }
        ref_power_w: { type: [integer, "null"], description: Null if the activity has no power meter and no target_power is set. }
        halves:
          type: [object, "null"]
          properties:
            first_s: { type: integer }
            second_s: { type: integer }
        splits:
          type: array
          items:
            type: object
            properties:
              label: { type: [string, "null"], description: "e.g. \"Lap 2\" or \"Finish\" for the last partial split." }
              start_km: { type: number }
              end_km: { type: number }
              time_s: { type: integer }
              pace_s_per_km: { type: [number, "null"] }
              gap_pace_s_per_km:
                type: [number, "null"]
                description: >
                  Grade-adjusted pace - the flat-equivalent pace for the same effort,
                  from the Minetti et al. (2002) cost-of-running-on-a-gradient model.
                  Null when avg_grade_pct is null (no reliable altitude).
              avg_hr: { type: [integer, "null"] }
              avg_power: { type: [integer, "null"], description: Null if the activity has no power meter. }
              delta_vs_ref_s_per_km:
                type: [number, "null"]
                description: gap_pace_s_per_km vs the reference pace when GAP is available, else pace_s_per_km vs it.
              delta_power_w:
                type: [integer, "null"]
                description: >
                  avg_power vs ref_power_w - the frontend prefers this over
                  delta_vs_ref_s_per_km/GAP whenever the activity has power data, since
                  power already accounts for grade mechanically rather than estimating
                  it from a cost model. Null unless both avg_power and ref_power_w are set.
              section_type:
                type: [string, "null"]
                enum: [steep_descent, descent, flat, climb, steep_climb, null]
                description: The course section type for a mode=elevation split; null for laps/1/5.
              gain_m: { type: [integer, "null"], description: Set only for mode=elevation. }
              loss_m: { type: [integer, "null"], description: Set only for mode=elevation. }
              avg_grade_pct:
                type: [number, "null"]
                description: >
                  Net grade over the split. For mode=elevation this is the course
                  section's own grade; for laps/1/5 it's computed from the activity's
                  own recorded altitude (null if that's missing).

    RaceWeather:
      description: GET /v1/races/{id}/weather, and its public equivalent.
      type: object
      properties:
        available: { type: boolean }
        date: { type: [string, "null"], format: date }
        temperature_max_c: { type: [number, "null"] }
        temperature_min_c: { type: [number, "null"] }
        precipitation_probability_pct: { type: [integer, "null"] }
        wind_speed_max_kmh: { type: [number, "null"] }

    UploadBatch:
      type: object
      description: >
        A bulk .zip upload. Created by POST /v1/activities/batch and polled at
        GET /v1/uploads/batches/{id}. Holds one child Upload per file in the archive.
      properties:
        id: { type: string, example: bat_3Yc1Qd }
        object: { type: string, const: upload_batch }
        status:
          type: string
          enum: [unpacking, processing, completed, failed]
          description: >
            `unpacking` reading the archive; `processing` files parsing; `completed`
            every file settled; `failed` the archive itself was unreadable.
          example: processing
        filename: { type: string, example: garmin-export-2026.zip }
        progress:
          type: number
          description: Fraction of files settled, 0–1.
          example: 0.42
        counts:
          type: object
          description: Tally of child uploads by outcome.
          properties:
            total: { type: integer, example: 124 }
            ready: { type: integer, example: 50 }
            processing: { type: integer, example: 71 }
            failed: { type: integer, example: 1 }
            duplicate: { type: integer, example: 2 }
            skipped: { type: integer, example: 0 }
        uploads:
          type: array
          description: The child upload jobs (paginated for large archives).
          items:
            $ref: "#/components/schemas/Upload"
        received_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    UploadHistoryPurge:
      type: object
      required: [uploads_deleted, files_deleted]
      properties:
        uploads_deleted:
          type: integer
          description: Number of upload records deleted.
          example: 149393
        files_deleted:
          type: integer
          description: Number of stored source files removed from storage.
          example: 12804

    Upload:
      type: object
      description: >
        An asynchronous .fit upload job. Created by POST /v1/activities and polled at
        GET /v1/uploads/{id}.
      properties:
        id: { type: string, example: upl_8KQ2a7 }
        object: { type: string, const: upload }
        status:
          type: string
          enum: [queued, processing, ready, failed, duplicate, skipped]
          description: >
            `queued` accepted, awaiting a worker; `processing` parsing the file;
            `ready` parsed and the activity created; `failed` parsing errored;
            `duplicate` the file matched an existing activity; `skipped` (batch
            imports only) the file was valid but held no activity data, e.g. the
            metadata stubs Garmin account exports mix in with real activities.
          example: processing
        progress:
          type: number
          description: Fraction parsed, 0–1. Null until processing begins.
          example: 0.0
        filename: { type: string, example: 2026-06-15-intervals.fit }
        activity_id:
          type: [string, "null"]
          description: The created (or matched) activity once status is ready or duplicate; otherwise null.
          example: null
        activity_sport:
          type: [string, "null"]
          enum: [bike, run, swim, walk, multisport, transition, null]
          description: The created activity's sport once activity_id is set; otherwise null.
          example: null
        error:
          type: [object, "null"]
          description: Present only when status is failed.
          properties:
            code: { type: string, example: corrupt_file }
            message: { type: string, example: "Unreadable FIT header at byte 0." }
        received_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    Lap:
      type: object
      properties:
        index: { type: integer, example: 1 }
        duration: { type: integer, description: Seconds, example: 300 }
        distance_km: { type: number, example: 1.02 }
        avg_hr: { type: integer, example: 162 }
        avg_power: { type: integer, example: 288 }

    Streams:
      type: object
      properties:
        object: { type: string, const: streams }
        resolution: { type: string, example: high }
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: number }
          description: >
            Channels present depend on the device. Runs recorded with a Stryd
            footpod can include air_temp (°C) and humidity (% RH); a CORE sensor
            adds core_temp and skin_temp (°C) plus heat_strain.
          example:
            time: [0, 1, 2, 3]
            power: [210, 214, 219, 222]
            heartrate: [128, 129, 131, 132]
            core_temp: [37.6, 37.6, 37.7, 37.7]
            skin_temp: [33.1, 33.2, 33.2, 33.3]
            air_temp: [21.4, 21.4, 21.5, 21.6]
            humidity: [58, 58, 57, 57]

    DurationCurve:
      type: object
      properties:
        metric: { type: string, enum: [power, heartrate], example: power }
        extends_to: { type: integer, description: Seconds; full activity length when over 3600., example: 5449 }
        points:
          type: object
          additionalProperties: { type: number }
          description: Map of duration-in-seconds to best average value.
          example: { "5": 712, "60": 538, "300": 351, "1200": 289, "3600": 259, "5449": 192 }

    BestEffort:
      type: object
      properties:
        window: { type: string, description: Duration (power) or distance (run)., example: 5min }
        value: { type: number, example: 351 }
        unit: { type: string, example: watts }
        date: { type: string, format: date }
        activity_id: { type: string }

    ActivityDurabilityRow:
      type: object
      description: Best mean-max power for window_s that starts after threshold of accumulated fatigue has been reached.
      properties:
        threshold:
          type: integer
          description: kJ of work (ride) or minutes of moving time (run). 0 = fresh (no fatigue gate).
          example: 2000
        window_s: { type: integer, enum: [300, 1200, 3600] }
        power: { type: integer, description: W }
        start_offset_s: { type: integer, description: Elapsed seconds from activity start to this window's own start. }

    DurabilitySportSection:
      type: object
      properties:
        basis: { type: string, enum: [kj, minutes] }
        thresholds:
          type: array
          items: { type: integer }
          example: [0, 1000, 2000, 3000]
        windows:
          type: array
          items: { type: integer }
          example: [300, 1200, 3600]
        cells:
          type: array
          items:
            type: object
            properties:
              window_s: { type: integer }
              threshold: { type: integer }
              power: { type: integer }
              pct_of_fresh: { type: [integer, "null"] }
              activity_id: { type: string }
              activity_name: { type: string }
              date: { type: string, format: date }

    RecentTopEffort:
      type: object
      properties:
        activity_id: { type: string }
        date: { type: string, format: date }
        sport: { type: string, example: run }
        kind:
          type: string
          enum: [cycling_hr, cycling_power, running_hr, running_pace, running_power]
        window: { type: string, example: 5min }
        value: { type: number, example: 342 }
        unit: { type: string, example: w }
        ranks:
          type: object
          description: 1-based rank per period, or null if not in that period's top-N.
          properties:
            16w: { type: integer, nullable: true }
            1y: { type: integer, nullable: true }
            all: { type: integer, nullable: true }
          example: { "16w": 1, "1y": 1, "all": 3 }

    Tag:
      type: object
      properties:
        id: { type: string, example: tag_race }
        name: { type: string, example: Race }
        origin: { type: string, enum: [manual, auto], example: manual }
        color: { type: string, example: "#e0442e" }

    ActivityComment:
      type: object
      properties:
        id: { type: string, example: cmt_9f2a7c }
        activity_id: { type: string }
        author_id: { type: string }
        author_name: { type: string, example: Alex Coach }
        author_role:
          type: string
          enum: [athlete, coach, viewer]
          description: >
            Derived at read time from the author's relationship to the
            activity's owner, not stored — it can change if a share is later
            revoked.
          example: coach
        text: { type: string, example: Great pacing on the back half! }
        created: { type: string, format: date-time }

    Workout:
      type: object
      properties:
        id: { type: string, example: wkt_vo2_5x5 }
        name: { type: string, example: "VO2 Max · 5×5" }
        sport: { type: string, enum: [bike, run] }
        type: { type: string, example: vo2 }
        duration: { type: integer, description: Seconds, example: 3300 }
        tss: { type: integer, example: 78 }
        folder_id: { type: [string, "null"] }
        tags: { type: array, items: { type: string }, example: [intervals, "race prep"] }
        chart_preview:
          type: array
          items: { type: number }
          description: >
            Flattened per-leaf average target intensity (repeat groups unrolled),
            recomputed whenever steps are replaced — cheap chart data for the
            Workout Library screen without shipping the full step tree.
        updated_at: { type: string, format: date-time }

    WorkoutFolder:
      type: object
      properties:
        id: { type: string, example: wfd_vo2_max }
        name: { type: string, example: "VO2 Max" }
        count: { type: integer, description: Number of workouts currently in this folder. }

    WorkoutCreate:
      type: object
      required: [name, sport, steps]
      properties:
        name: { type: string }
        sport: { type: string, enum: [bike, run] }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkoutStep"
        folder_id: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }

    WorkoutStep:
      type: object
      required: [kind]
      description: >
        A leaf step (`warmup`/`block`/`rec`/`cool`) or a `repeat` group. Groups
        carry `repeat` and `children` instead of an end condition or target;
        a group's `children` may themselves include nested `repeat` groups
        (e.g. 2× of [4×4min @280W, 4min recovery] + 5min recovery).
      properties:
        kind: { type: string, enum: [warmup, block, rec, cool, repeat] }
        end_type:
          type: string
          enum: [time, distance, manual]
          description: >
            How the step ends. Required for leaf kinds; omit for `repeat`.
            `time` requires `duration`; `distance` requires `distance`;
            `manual` advances when the athlete taps lap.
        duration: { type: [integer, "null"], description: Seconds; required when end_type is time. }
        distance: { type: [integer, "null"], description: Metres; required when end_type is distance. }
        target_type:
          type: string
          enum: [power, hr, pace, cadence, open]
          description: Primary target dimension for a leaf step. `open` = no target (manual lap).
        target_low: { type: [number, "null"], description: "Zone floor, or ramp start if target_high differs. Unit follows target_type: %FTP or watts (see power_unit) for power, %max HR, %threshold pace, or rpm." }
        target_high: { type: [number, "null"], description: Zone ceiling, or ramp end. Equal to target_low for a flat (non-ramping) target. }
        power_unit: { type: string, enum: [pct_ftp, watts], default: pct_ftp, description: Only meaningful when target_type=power - whether target_low/target_high are a percentage of FTP/critical_run_power or absolute watts. }
        target2_type: { type: string, enum: [cadence, none], default: none, description: Optional secondary constraint alongside target_type. }
        target2_low: { type: [number, "null"], description: rpm, when target2_type=cadence. }
        target2_high: { type: [number, "null"], description: rpm, when target2_type=cadence. }
        repeat: { type: integer, default: 1, description: Reps of `children`; only meaningful when kind=repeat. }
        note: { type: [string, "null"], description: Coach cue shown on-device during this step. }
        children:
          type: array
          items: { $ref: "#/components/schemas/WorkoutStep" }
          description: Present only when kind=repeat. May contain leaf steps and/or nested repeat groups.

    ScheduledWorkout:
      type: object
      properties:
        id: { type: string, example: sch_88 }
        workout_id: { type: string }
        athlete_id: { type: string }
        assigned_by: { type: [string, "null"], description: Coach who assigned it. }
        date: { type: string, format: date }
        time_of_day: { $ref: "#/components/schemas/TimeOfDay" }
        status: { type: string, enum: [planned, completed, missed], example: planned }
        activity_id: { type: [string, "null"], description: Completed activity that matched. }

    ZoneSet:
      type: object
      properties:
        type: { type: string, enum: [heart_rate, bike_power, run_power, pace] }
        reference: { type: number, description: The threshold the zones are computed from. }
        zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"

    Zone:
      type: object
      required: [name, low_pct, high_pct]
      properties:
        name: { type: string, example: Z2 Endurance }
        low_pct: { type: number, example: 56 }
        high_pct: { type: number, example: 75 }

    RosterEntry:
      type: object
      properties:
        athlete_id: { type: string, example: ath_sofia }
        name: { type: string, example: Sofia Greco }
        compliance: { type: number, description: Completed over planned over the window., example: 0.92 }
        tsb: { type: integer, description: Training stress balance (form)., example: -8 }
        flags: { type: integer, example: 1 }

    CoachAthlete:
      type: object
      properties:
        athlete_id: { type: string }
        ctl: { type: integer, description: Fitness, example: 71 }
        atl: { type: integer, description: Fatigue, example: 79 }
        tsb: { type: integer, description: Form, example: -8 }
        next_workout: { type: [string, "null"] }

    Bike:
      type: object
      properties:
        id: { type: string, example: bike_road }
        athlete_id: { type: string }
        name: { type: string, example: Tarmac SL7 }
        kind: { type: string, enum: [road, indoor, gravel, tt] }
        groupset: { type: string }
        distance_km: { type: integer, example: 9120 }
        hours: { type: number }
        rides: { type: integer }
        components: { type: integer, description: Count of tracked wear components., example: 5 }

    Component:
      type: object
      properties:
        id: { type: string }
        bike_id: { type: string }
        name: { type: string, example: Chain }
        km: { type: integer, example: 4080 }
        limit_km: { type: integer, example: 4000 }
        model: { type: string, example: KMC X11SL }

    Shoe:
      type: object
      properties:
        id: { type: string, example: shoe_vf3 }
        athlete_id: { type: string }
        shoe_model_version_id: { type: string, example: smv_vaporfly3 }
        manufacturer: { type: string, example: Nike }
        model: { type: string, example: Vaporfly }
        version: { type: string, example: "3" }
        colourway: { type: string, example: "Volt / Black" }
        name:
          type: string
          description: Unique per athlete; defaults to manufacturer + model + version + colourway.
          example: Race Day Flyers
        image: { type: [string, "null"], format: uri }
        role: { type: string, example: Race & threshold }
        km: { type: integer, example: 412 }
        limit_km: { type: integer, example: 600 }
        since: { type: string, format: date }

    ShoeModel:
      type: object
      description: Catalog entry — a manufacturer + product line.
      properties:
        id: { type: string, example: sm_vaporfly }
        manufacturer: { type: string, example: Nike }
        model: { type: string, example: Vaporfly }

    ShoeModelVersion:
      type: object
      description: Catalog entry — a generation of a shoe model.
      properties:
        id: { type: string, example: smv_vaporfly3 }
        shoe_model_id: { type: string, example: sm_vaporfly }
        version: { type: string, example: "3" }

    Webhook:
      type: object
      properties:
        id: { type: string, example: whk_4a }
        url: { type: string, format: uri }
        status: { type: string, enum: [active, disabled], example: active }
        events:
          type: array
          items: { type: string }
          example: [activity.created, scheduled_workout.matched]
        secret: { type: string, description: Returned once on creation., example: whsec_9d2 }

    WorkoutMatch:
      type: object
      description: A completed activity matched to a designed workout.
      properties:
        activity_id: { type: string, example: act_9f2a7c }
        name: { type: string, example: "VO2 intervals · Tuesday AM" }
        date: { type: string, format: date }
        method: { type: string, enum: [auto, manual], example: auto }
        confidence:
          type: number
          description: Match confidence 0–1 (auto matches only).
          example: 0.94
        compliance:
          type: number
          description: How closely the execution hit the planned targets, 0–1.
          example: 0.88

    FitnessPoint:
      type: object
      description: One day of the performance-management series.
      properties:
        date: { type: string, format: date }
        ctl: { type: number, description: Fitness (chronic training load)., example: 62 }
        atl: { type: number, description: Fatigue (acute training load)., example: 71 }
        tsb: { type: number, description: Form (training stress balance = CTL − ATL)., example: -9 }

    ThresholdSummaryEntry:
      type: object
      description: >
        One field's current state - the best qualifying effort within the trailing
        threshold_window_days, so a value can drop as an old best effort ages out,
        not just rise. A manually-entered value (see PATCH /v1/athletes/{id})
        functions the same way from the moment it's set.
      properties:
        value:
          oneOf: [{ type: number }, { type: string }, { type: "null" }]
          description: Watts for ftp/critical_run_power, "mm:ss" for threshold_pace. Null if nothing has ever qualified.
          example: 265
        previous_value:
          oneOf: [{ type: number }, { type: string }, { type: "null" }]
          example: 262
        source_activity_id:
          type: [string, "null"]
          description: Null for a manually-entered value, not sourced from any activity.
          example: act_9f2a7c
        effective_from: { type: [string, "null"], format: date }
        stale:
          type: boolean
          description: >
            The current entry's source has aged out of the trailing window with
            nothing yet to replace it - surfaced for a manual refresh (POST
            /v1/athletes/{id}/thresholds/refresh), never silently corrected. True
            with no entry at all.
          example: false

    ThresholdHistoryEntry:
      type: object
      description: One ledger row - a value that was effective from a given date until superseded.
      properties:
        value:
          oneOf: [{ type: number }, { type: string }]
          example: 265
        source_activity_id: { type: [string, "null"], example: act_9f2a7c }
        effective_from:
          type: string
          format: date
          description: The qualifying activity's own date.
        current_from:
          type: string
          format: date
          description: >-
            The date this row actually became the recorded current value - can differ from
            effective_from when this row only won later, via an earlier better row aging out of
            its trailing window.

    ThresholdSuggestion:
      type: object
      description: >
        One pending Threshold suggestion - shape varies by `kind`. See GET
        /v1/athletes/{id}/threshold-suggestions.
      required: [id, field, kind]
      properties:
        id:
          type: string
          description: "field:kind:key - stable for this occurrence's lifetime."
          example: "ftp:rejected:act_123"
        field: { type: string, enum: [ftp, critical_run_power, threshold_pace] }
        kind: { type: string, enum: [rejected, upcoming_drop, race_will_refresh] }
        current:
          oneOf: [{ type: number }, { type: string }]
          description: The athlete's current value (absent for race_will_refresh). Watts, or "M:SS" for threshold_pace.
          example: 265
        proposed:
          oneOf: [{ type: number }, { type: string }, { type: "null" }]
          description: >
            rejected: the candidate's implied value. upcoming_drop: the successor
            that takes over, or null if the value would simply go stale with
            nothing behind it. Absent for race_will_refresh.
          example: 297
        delta_pct:
          type: [number, "null"]
          description: Unsigned percent change between current and proposed. Absent for race_will_refresh.
          example: 12.1
        activity_id:
          type: [string, "null"]
          description: >
            rejected: the candidate activity. upcoming_drop: the expiring
            entry's own source activity (null if it was a manual entry). Absent
            for race_will_refresh.
          example: act_123
        activity_date:
          type: string
          format: date
          description: rejected/upcoming_drop only - the above activity's own date.
        implied_from:
          type: object
          description: >
            rejected only - the raw effort behind `proposed`, before any
            multiplier (e.g. FTP's 20-min-test x0.95). Equal to `proposed` for a
            field/method with no multiplier step (critical_run_power,
            threshold_pace, and ftp under ftp_calculation_method=sixty_min_direct).
          properties:
            window: { type: string, example: 20min }
            value: { type: number, example: 313 }
        expiry_date:
          type: string
          format: date
          description: upcoming_drop/race_will_refresh only - when the current value ages out.
        days_left:
          type: integer
          description: upcoming_drop/race_will_refresh only - recomputed daily from the cached expiry_date, not itself cached stale.
          example: 12
        race:
          type: object
          description: race_will_refresh only.
          properties:
            id: { type: string }
            name: { type: string }
            date: { type: string, format: date }

    ShareRole:
      type: string
      enum: [viewer, coach]
      description: >
        `viewer` — read-only access to activities, analysis, workouts, and calendar.
        `coach` — everything a viewer can, plus create and assign workouts.

    Share:
      type: object
      description: A grant of access to your training data.
      properties:
        id: { type: string, example: shr_7c1a2b }
        name: { type: string, example: Mara Køhl }
        handle: { type: string, example: "@marakohl" }
        role: { $ref: "#/components/schemas/ShareRole" }
        status: { type: string, enum: [pending, active], example: active }
        since: { type: string, format: date }

    AccessToken:
      type: object
      description: >
        A personal access token. The secret is only ever returned at creation or
        rotation; listings show the prefix only.
      properties:
        id: { type: string, example: tok_7Qda }
        name: { type: string, example: Home server sync }
        prefix: { type: string, description: First chars of the secret, for recognition., example: cad_pat_7Qda }
        scopes:
          type: array
          items: { type: string }
          example: [activities:read]
        created: { type: string, format: date }
        expires_at: { type: [string, "null"], format: date, example: "2026-07-11" }
        last_used: { type: [string, "null"], format: date, example: "2026-06-14" }

    ServiceRecord:
      type: object
      description: A maintenance event logged against a component.
      properties:
        id: { type: string, example: svc_4a1 }
        component_id: { type: string, example: cmp_chain }
        action: { type: string, enum: [replaced, cleaned, inspected, adjusted], example: replaced }
        reset: { type: boolean, example: true }
        note: { type: string, example: "New KMC chain, old one at 4080 km." }
        date: { type: string, format: date }

    ShoeCatalogEntry:
      type: object
      description: A catalog model version returned by the shoe picker search.
      properties:
        shoe_model_version_id: { type: string, example: smv_vaporfly3 }
        manufacturer: { type: string, example: Nike }
        model: { type: string, example: Vaporfly }
        version: { type: string, example: "3" }
        display_name: { type: string, example: Nike Vaporfly 3 }

    Race:
      type: object
      properties:
        id: { type: string, example: race_v4l3nc1a }
        athlete_id: { type: string }
        name: { type: string, example: Valencia Marathon }
        date: { type: string, format: date }
        sport: { $ref: "#/components/schemas/Sport" }
        priority:
          type: string
          enum: [A, B, C]
          default: A
          description: A races get a training block; B and C are tune-ups that nest inside the A race whose block they fall in.
          example: A
        course_id: { type: [string, "null"] }
        distance_km: { type: [number, "null"] }
        goal_time: { type: [string, "null"], description: "H:MM:SS. Optional and editable even once the race has a result." }
        result_time: { type: [string, "null"], description: "H:MM:SS, once raced." }
        target_power:
          type: [integer, "null"]
          description: >
            Target average power in watts. When set, this (rather than the linked activity's own
            average power) is the reference GET /v1/races/{id}/splits uses for delta_power_w.
            Optional and editable even once the race has a result, like goal_time.
        activity_id: { type: [string, "null"], description: The matching recorded activity, if linked. }
        url: { type: [string, "null"], format: uri }
        results_url: { type: [string, "null"], format: uri, description: Link to the athlete's own results page on the race organiser's site. }
        notes: { type: string }
        key_session_tag_id:
          type: [string, "null"]
          description: Overrides the athlete-wide "Key session" tag lookup for this race's key_sessions "tagged" category. Null uses that default.
        parent_race_id:
          type: [string, "null"]
          description: B/C races only - the first A race on/after this one whose block contains this race's week. Null for an A race, or a standalone tune-up.
        block_start:
          type: [string, "null"]
          format: date
          description: Start of this race's own training block (A), or of its parent A's block (B/C with a parent). Null for a standalone B/C race.
        block_weeks:
          type: [integer, "null"]
          description: Length of the block named by block_start, possibly truncated by an earlier A race - see GET /v1/races/{id}/block.
        block_weeks_requested:
          type: [integer, "null"]
          description: >
            A races only. An explicit override for this race's own training-block length -
            takes precedence over the athlete's per-distance-bucket default
            (race_block_week_defaults) and flat race_block_weeks preference, in that order (see
            GET /v1/races/{id}/block). Distinct from the read-only, always-present block_weeks
            above, which is the *resolved* length after that whole fallback chain.
        base_weeks_requested:
          type: [integer, "null"]
          description: >
            A races only. Explicit Base-phase length in weeks - base_weeks_requested +
            build_weeks_requested + peak_weeks_requested + taper_weeks_requested must equal
            block_weeks_requested exactly when any of the four is set (all four are required
            together). Null falls back to the proportional Base/Build/Peak/Taper split.
        build_weeks_requested: { type: [integer, "null"], description: A races only - see base_weeks_requested. }
        peak_weeks_requested: { type: [integer, "null"], description: A races only - see base_weeks_requested. }
        taper_weeks_requested: { type: [integer, "null"], description: A races only - see base_weeks_requested. }
        is_public:
          type: boolean
          description: >
            Whether the race is readable without authentication via
            GET /v1/public/races/{id}. False by default; set via PATCH /v1/races/{id}.
          example: false

    PublicRace:
      type: object
      description: >
        The unauthenticated view of a public race, for sharing a result with friends
        and family. A narrow allowlist - no notes, priority, training block, target
        power or anything else from the athlete's training.
      properties:
        id: { type: string }
        athlete_name: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        sport: { type: string }
        distance_km: { type: [number, "null"] }
        goal_time: { type: [string, "null"], description: "H:MM:SS" }
        result_time: { type: [string, "null"], description: "H:MM:SS" }
        url: { type: [string, "null"], format: uri }
        results_url: { type: [string, "null"], format: uri }
        activity:
          type: [object, "null"]
          description: >
            The linked activity's headline numbers only - the activity itself stays
            private unless separately shared. Null when no activity is linked.
          properties:
            avg_hr: { type: [integer, "null"] }
            avg_power: { type: [integer, "null"] }
            avg_air_temp: { type: [number, "null"] }
            avg_humidity: { type: [integer, "null"] }
        course:
          type: [object, "null"]
          description: >
            The linked course's shape and elevation - nothing about who made it or their
            other races on it. Null when no course is linked. Fields as on Course.
          properties:
            name: { type: string }
            location_name: { type: string }
            distance_km: { type: [number, "null"] }
            elevation_gain_m: { type: [integer, "null"] }
            elevation_loss_m: { type: [integer, "null"] }
            elevation_max_m: { type: [integer, "null"] }
            elevation_min_m: { type: [integer, "null"] }
            is_loop: { type: boolean }
            route_polyline: { type: array, items: { type: array, items: { type: number } } }
            elevation_profile: { type: array, items: { type: array, items: { type: number } } }
            elevation_quality: { type: string }
            sections: { type: array, items: { type: object } }

    RaceComment:
      type: object
      properties:
        id: { type: string, example: rcm_8kq2a7 }
        race_id: { type: string }
        author_id: { type: string }
        author_name: { type: string }
        role:
          type: string
          enum: [athlete, coach]
          description: Snapshotted at post time, not recomputed if the coaching relationship later changes.
        text: { type: string, maxLength: 2000 }
        week: { type: [integer, "null"] }
        parent_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    CourseSummary:
      type: object
      description: The shape returned by GET /v1/courses - full route/elevation detail is on GET /v1/courses/{id} only.
      properties:
        id: { type: string, example: course_v4l3nc1a }
        athlete_id: { type: string }
        name: { type: string, example: Valencia Marathon }
        location_name: { type: string, example: "Valencia, Spain" }
        distance_km: { type: [number, "null"] }
        source: { type: string, enum: [gpx, activity] }
        created_at: { type: string, format: date-time }
        race_count: { type: integer }

    CourseSectionSettings:
      type: object
      description: >
        How courses are split into sections (backend/courses/sections.py, backend_java's
        CourseSections). Ranges keep a marathon from being cut into thousands of sections.
      properties:
        algorithm: { type: string, enum: [douglas_peucker, bottom_up], default: douglas_peucker }
        flat_max_pct: { type: number, minimum: 0.5, maximum: 3, default: 1.0, description: "Average grade within +/- this is flat." }
        steep_min_pct: { type: number, minimum: 2, maximum: 10, default: 4.0, description: "Average grade beyond +/- this is steep. Must be greater than flat_max_pct." }
        fit_tolerance_m: { type: number, minimum: 0.5, maximum: 10, default: 2.0, description: Max vertical error of each straight-line section against the smoothed profile. }
        min_section_m: { type: number, minimum: 50, maximum: 1000, default: 250, description: Shorter sections fold into a neighbour, unless they rise or drop at least keep_min_rise_m. }
        keep_min_rise_m: { type: number, minimum: 1, maximum: 20, default: 5 }
        spike_window_m: { type: number, minimum: 0, maximum: 100, default: 30, description: Running-median window for spike removal. }
        smoothing_window_m: { type: number, minimum: 20, maximum: 300, default: 100, description: Running-mean window. }
        resample_step_m: { type: number, minimum: 10, maximum: 50, default: 10 }

    ActivitySections:
      type: object
      required: [object, activity_id, elevation_quality, elevation_profile, sections, climbs]
      properties:
        object: { type: string, enum: [activity_sections] }
        activity_id: { type: string }
        elevation_quality:
          type: string
          enum: [ok, missing, sparse]
          description: >
            ok, or why there are no sections - missing (no or flat altitude recorded) or sparse
            (samples too far apart to see hills between them).
        elevation_profile:
          type: array
          description: >
            At most 200 [km, elevation_m] pairs from the stored series, smoothed with the same
            spike and smoothing windows as the sections. Empty unless elevation_quality is ok.
          items:
            type: array
            items: { type: number }
        sections:
          type: array
          description: The whole activity split into sections; positions are km from its start.
          items: { $ref: "#/components/schemas/CourseSection" }
        climbs:
          type: array
          description: The climb and steep_climb sections, in Course.climbs' shape.
          items:
            type: object
            properties:
              start_km: { type: number }
              end_km: { type: number }
              gain_m: { type: integer }
              avg_grade_pct: { type: number }
    CourseSection:
      type: object
      properties:
        type: { type: string, enum: [steep_descent, descent, flat, climb, steep_climb] }
        start_km: { type: number }
        end_km: { type: number }
        length_m: { type: integer }
        gain_m: { type: integer }
        loss_m: { type: integer }
        avg_grade_pct: { type: number }
        steepest_100m_pct: { type: number, description: Steepest 100m inside the section - uphill for a climb or flat, downhill for a descent. }

    Course:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          properties:
            start_lat: { type: [number, "null"] }
            start_lng: { type: [number, "null"] }
            elevation_gain_m: { type: [integer, "null"] }
            elevation_loss_m: { type: [integer, "null"] }
            elevation_max_m: { type: [integer, "null"] }
            elevation_min_m: { type: [integer, "null"] }
            is_loop: { type: boolean, description: Start and finish within 200m. }
            source_activity_id: { type: [string, "null"] }
            gpx_filename: { type: string, description: Empty for a course created from an activity. }
            route_polyline:
              type: array
              description: Simplified [lat, lng] points (Douglas-Peucker), ~300-500 points.
              items:
                type: array
                items: { type: number }
            elevation_profile:
              type: array
              description: "[km, elevation_m] pairs, ~200 points evenly spaced by distance."
              items:
                type: array
                items: { type: number }
            elevation_quality:
              type: string
              enum: [ok, missing, sparse]
              description: >
                ok, or why the course has no sections - missing (no or flat elevation in the source)
                or sparse (points too far apart to see hills between them).
            sections:
              type: array
              description: >
                The whole course split into flat, climb and descent sections, calculated on this
                request with the owner's course_section_settings (or a preview's overrides). Empty
                unless elevation_quality is ok. Positions are km from the course's start.
              items: { $ref: "#/components/schemas/CourseSection" }
            climbs:
              type: array
              description: The climb and steep_climb sections, in the shape climbs have always had.
              items:
                type: object
                properties:
                  start_km: { type: number }
                  end_km: { type: number }
                  gain_m: { type: integer }
                  avg_grade_pct: { type: number }
            races:
              type: array
              description: Every race run on this course.
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  date: { type: string, format: date }
                  priority: { type: string, enum: [A, B, C] }
                  result_s: { type: [integer, "null"] }

webhooks:
  activityCreated:
    post:
      summary: activity.created
      description: Sent when a newly uploaded activity finishes processing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, const: activity.created }
                created: { type: string, format: date-time }
                data:
                  $ref: "#/components/schemas/Activity"
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  scheduledWorkoutMatched:
    post:
      summary: scheduled_workout.matched
      description: Sent when a completed activity is matched to a planned workout.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, const: scheduled_workout.matched }
                created: { type: string, format: date-time }
                data:
                  $ref: "#/components/schemas/ScheduledWorkout"
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

  uploadBatchCompleted:
    post:
      summary: upload_batch.completed
      description: Sent once when every file in a bulk .zip upload has settled.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, const: upload_batch.completed }
                created: { type: string, format: date-time }
                data:
                  $ref: "#/components/schemas/UploadBatch"
      responses:
        "200":
          description: Return 200 to acknowledge receipt.

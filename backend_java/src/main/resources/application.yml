server:
  port: 8080

spring:
  application:
    name: cadence-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cadence_java}
    username: ${POSTGRES_USER:cadence}
    password: ${POSTGRES_PASSWORD:cadence}

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      # Must be >= the largest of cadence.uploads.max-upload-bytes and cadence.import.max-file-bytes
      # below - otherwise Tomcat's multipart layer rejects large-but-legitimate files before they
      # ever reach the app's own size check, with a generic framework error instead of our typed
      # 413 response. 2GB to cover a full-account data-export re-import (cadence.import above),
      # even though a single activity upload never needs more than cadence.uploads.max-upload-bytes.
      max-file-size: 2GB
      max-request-size: 2GB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  ai:
    mcp:
      server:
        # Streamable HTTP (not the older SSE transport) mounted at the framework default
        # POST /mcp - secured by SecurityConfig same as every other endpoint, since Spring AI's
        # MCP server starter provides no authentication of its own by design (per its own docs).
        protocol: STREAMABLE
        type: SYNC
        name: cadence-api
        version: 0.1.0

cadence:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/jwt_private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/jwt_public.pem}
    kid: ${JWT_KID:801}
    issuer: ${JWT_ISSUER:https://api.cadence.cc}
    audience: ${JWT_AUDIENCE:cadence-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  uploads:
    media-root: ${MEDIA_ROOT:media}
    max-upload-bytes: 209715200
    max-batch-files: 50000
  data-import:
    max-file-bytes: 2147483648
  oauth:
    first-party-client-secret: ${OAUTH_FIRST_PARTY_CLIENT_SECRET:dev-only-secret-change-me}
    # The MCP OAuth client - unlike the first-party client, this one requires PKCE and consent
    # (see McpClientConfig) since it's a genuine third-party grant (Claude.ai/Claude Desktop),
    # not Cadence's own frontend. Pasted into Claude's "Add custom connector -> Advanced
    # settings" alongside the server URL - no Dynamic Client Registration needed.
    mcp-client-secret: ${OAUTH_MCP_CLIENT_SECRET:dev-only-secret-change-me}
    issuer: ${OAUTH_ISSUER:https://api.cadence.cc}
  rate-limit:
    register-max-attempts: ${REGISTER_RATE_LIMIT_MAX_ATTEMPTS:5}
    register-window-minutes: ${REGISTER_RATE_LIMIT_WINDOW_MINUTES:60}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@cadence.cc}
    # Where the frontend's "verify your email" screen lives - the token is appended as ?token=...
    verification-base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
    verification-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    # Explicit rather than left to SesV2Client's default region provider chain - that chain
    # requires either an env var/profile or a reachable EC2 metadata service, neither of which
    # exists in local/docker-compose dev, and failing to resolve one fails SesV2Client.builder()
    # .build() *eagerly*, at bean construction - it took the whole app down at boot, not just
    # email sending, before this was pinned. Matches infra/EC2_BACKEND_SKETCH.md's region.
    ses-region: ${SES_REGION:eu-west-2}
    # "ses" (real send, SesEmailService) or "log" (LoggingEmailService - logs the link instead
    # of sending; docker-compose.yml sets this for local dev, which has no AWS credentials).
    provider: ${EMAIL_PROVIDER:ses}

springdoc:
  swagger-ui:
    path: /schema/docs
  api-docs:
    path: /schema

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.cadence.api: ${CADENCE_LOG_LEVEL:INFO}

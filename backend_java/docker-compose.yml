services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence_java}
      POSTGRES_USER: ${POSTGRES_USER:-cadence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Offset from the Python stack's 5432 so both can run side by side locally.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend: &backend
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # No AWS credentials or verified SES identity locally - log the verification link
      # instead of sending it (see LoggingEmailService). Override in .env for real sends.
      EMAIL_PROVIDER: log
      # Local-dev only AES key for stored Garmin API keys; staging/prod must set their own.
      GARMIN_ENCRYPTION_KEY: ${GARMIN_ENCRYPTION_KEY:-ZGV2LW9ubHktZ2FybWluLWtleS1ub3Qtc2VjcmV0ISE=}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jwt_keys:/app/keys
      - media:/app/media
    ports:
      # Offset from the Python stack's 8000.
      - "8080:8080"
    # 2GB, not staging's real 600MB (see backend-memcapped below for that) - generous
    # headroom for ordinary local dev/browsing rather than reproducing the OOM squeeze,
    # while still being a real cap (not unbounded) now that G1/periodic-GC in the
    # Dockerfile's CMD is the default for every container built from this image.
    mem_limit: 2g
    memswap_limit: 2g

  # Same image/build as `backend`, but capped exactly like staging's container
  # (infra/terraform/modules/ec2/user_data.sh.tpl's --memory/--memory-swap) so
  # something like a heavier JFR recording or detail-mode NMT run actually sees the
  # same heap/off-heap squeeze that triggered the 2026-10-16 OOM, instead of the
  # unconstrained headroom a plain local run gets. Not started by a bare `docker
  # compose up` - needs the profile AND naming the service explicitly, otherwise
  # Compose also starts the profile-less `backend` alongside it on the same port:
  #   docker compose --profile memcapped up backend-memcapped
  backend-memcapped:
    <<: *backend
    profiles: ["memcapped"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      EMAIL_PROVIDER: log
      GARMIN_ENCRYPTION_KEY: ${GARMIN_ENCRYPTION_KEY:-ZGV2LW9ubHktZ2FybWluLWtleS1ub3Qtc2VjcmV0ISE=}
      # Unauthenticated JMX remote for jvisualvm/jconsole - local profiling only, loopback-
      # bound below, never set on the Dockerfile's own CMD (which staging deploys from) or
      # on `backend` above.
      JAVA_TOOL_OPTIONS: >-
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=127.0.0.1
    ports:
      - "8081:8080"
      - "127.0.0.1:9010:9010"
    mem_limit: 600m
    memswap_limit: 600m

volumes:
  postgres_data:
  jwt_keys:
  media:

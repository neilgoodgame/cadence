<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hanken Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  input:focus{outline:none;}
  ::placeholder{color:var(--ink3,#9a958d);}
  @keyframes drift{0%{transform:translateX(0);}100%{transform:translateX(-72px);}}
</style>
</helmet>

<div style="{{ themeVars }}">
<div style="display:flex;min-height:100vh;background:var(--canvas,#f3f1ee);color:var(--ink,#1b1a18);font-family:'Hanken Grotesk',sans-serif;">

  <!-- ============ LEFT BRAND PANEL ============ -->
  <div style="width:46%;max-width:680px;flex-shrink:0;position:relative;overflow:hidden;background:var(--brandBg,#15110f);display:flex;flex-direction:column;padding:36px 48px;gap:20px;color:#f3f1ee;">
    <!-- subtle gridline motif -->
    <div style="position:absolute;inset:0;background-image:linear-gradient(var(--gridLine,rgba(255,255,255,0.045)) 1px,transparent 1px),linear-gradient(90deg,var(--gridLine,rgba(255,255,255,0.045)) 1px,transparent 1px);background-size:34px 34px;"></div>
    <!-- ember glow -->
    <div style="position:absolute;top:-160px;right:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(236,74,38,0.42),transparent 68%);filter:blur(8px);"></div>

    <!-- brand mark -->
    <div style="position:relative;flex-shrink:0;display:flex;align-items:center;gap:12px;">
      <div style="width:30px;height:30px;border-radius:8px;background:var(--ember,#ec4a26);display:flex;align-items:center;justify-content:center;"><div style="width:13px;height:13px;border-radius:3px;background:#fff;"></div></div>
      <span style="font-weight:700;font-size:17px;letter-spacing:-0.01em;">Cadence</span>
    </div>

    <!-- center copy + chart motif -->
    <div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--ember,#ec4a26);font-weight:600;margin-bottom:20px;">TRAINING INTELLIGENCE</div>
      <h1 style="font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-0.025em;margin:0;max-width:13ch;text-wrap:balance;">Every watt, split and heartbeat in one place.</h1>
      <p style="font-size:15px;line-height:1.55;color:rgba(243,241,238,0.62);margin:18px 0 0;max-width:38ch;">Upload activities from any device, see the analysis that matters, and plan what comes next.</p>
    </div>
  </div>

  <!-- ============ RIGHT AUTH PANEL ============ -->
  <div data-screen-label="login" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;position:relative;">

    <!-- theme toggle top-right -->
    <div style="position:absolute;top:24px;right:28px;display:flex;gap:3px;background:var(--card,#fff);border:1px solid var(--line,#e6e2dc);border-radius:9px;padding:3px;">
      <div onClick="{{ setLab }}" style="{{ labBtn }}">Teal</div>
      <div onClick="{{ setCockpit }}" style="{{ cockpitBtn }}">Violet</div><div onClick="{{ setDay }}" style="{{ dayBtn }}">Day</div>
    </div>

    <div style="width:100%;max-width:392px;">
      <!-- mode tabs -->
      <div style="display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--line,#e6e2dc);">
        <div onClick="{{ setSignIn }}" style="{{ signInTab }}">Sign in</div>
        <div onClick="{{ setSignUp }}" style="{{ signUpTab }}">Create account</div>
      </div>

      <h2 style="font-size:26px;font-weight:800;letter-spacing:-0.02em;margin:0;color:var(--ink,#1b1a18);">{{ heading }}</h2>
      <p style="font-size:14px;color:var(--ink3,#9a958d);margin:6px 0 26px;">{{ subhead }}</p>

      <!-- form: email/password only — no social providers (Strava/Google/Apple) are wired up in the live app -->
      <div style="display:flex;flex-direction:column;gap:14px;">
        <sc-if value="{{ isSignUp }}" hint-placeholder-val="{{ false }}">
          <div>
            <label style="display:block;font-size:12px;font-weight:600;color:var(--ink2,#6f6b65);margin-bottom:6px;">Full name</label>
            <input type="text" placeholder="Neil Goodgame" style="{{ inputStyle }}">
          </div>
        </sc-if>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:var(--ink2,#6f6b65);margin-bottom:6px;">Email</label>
          <input type="email" placeholder="you@cadence.cc" style="{{ inputStyle }}">
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:var(--ink2,#6f6b65);margin-bottom:6px;">Password</label>
          <input type="password" placeholder="••••••••••" style="{{ inputStyle }}">
        </div>

        <a href="Dashboard.dc.html" style="text-decoration:none;">
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:10px;background:var(--ember,#ec4a26);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;white-space:nowrap;">
            {{ submitLabel }}
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="8" x2="13" y2="8"></line><polyline points="9,4 13,8 9,12"></polyline></svg>
          </div>
        </a>
      </div>

      <!-- footer -->
      <p style="font-size:13px;color:var(--ink3,#9a958d);text-align:center;margin:22px 0 0;">
        {{ footerText }} <span onClick="{{ toggleMode }}" style="color:var(--ember,#ec4a26);font-weight:600;cursor:pointer;">{{ footerLink }}</span>
      </p>
    </div>
  </div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1380,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { theme: 'lab', mode: 'signin' };

  renderVals() {
    const lab = { '--canvas': 'radial-gradient(115% 80% at 88% -8%, rgba(150,42,108,0.30), transparent 46%), radial-gradient(95% 78% at -8% 108%, rgba(18,134,122,0.32), transparent 52%), #080b11', '--card': 'rgba(15,24,33,0.60)', '--elev': 'rgba(24,35,46,0.50)', '--ink': '#eaf2f4', '--ink2': '#93a3b0', '--ink3': '#5c6b78', '--line': 'rgba(255,255,255,0.08)', '--ember': '#2dd4bf', '--emberSoft': 'rgba(45,212,191,0.13)', '--brandBg': '#15110f', '--gridLine': 'rgba(255,255,255,0.045)' };
    const cockpit = { '--canvas': 'radial-gradient(115% 80% at 90% -8%, rgba(168,85,247,0.28), transparent 46%), radial-gradient(95% 80% at -6% 106%, rgba(20,120,120,0.24), transparent 52%), #07080d', '--card': 'rgba(18,19,31,0.62)', '--elev': 'rgba(28,29,44,0.52)', '--ink': '#eef0f6', '--ink2': '#a0a3b8', '--ink3': '#6b6f86', '--line': 'rgba(255,255,255,0.08)', '--ember': '#c084fc', '--emberSoft': 'rgba(192,132,252,0.14)', '--brandBg': '#08090b', '--gridLine': 'rgba(255,255,255,0.04)' };
    const isLab = this.state.theme === 'lab';
    const isSignUp = this.state.mode === 'signup';

    const seg = (active) => ({ flex: 1, textAlign: 'center', padding: '6px 13px', fontSize: '12px', fontWeight: 600, borderRadius: '7px', cursor: 'pointer', color: active ? 'var(--ink,#1b1a18)' : 'var(--ink3,#9a958d)', background: active ? 'var(--card,#fff)' : 'transparent', boxShadow: active ? '0 1px 2px rgba(0,0,0,0.14)' : 'none' });

    const tab = (active) => ({ padding: '0 2px 12px', marginRight: '24px', fontSize: '15px', fontWeight: 700, letterSpacing: '-0.01em', cursor: 'pointer', whiteSpace: 'nowrap', color: active ? 'var(--ink,#1b1a18)' : 'var(--ink3,#9a958d)', borderBottom: active ? '2px solid var(--ember,#ec4a26)' : '2px solid transparent', marginBottom: '-1px' });

    const inputStyle = { width: '100%', padding: '12px 14px', borderRadius: '10px', border: '1px solid var(--line,#e6e2dc)', background: 'var(--elev,#faf9f7)', fontSize: '14px', fontFamily: "'Hanken Grotesk',sans-serif", color: 'var(--ink,#1b1a18)' };

    return {
      themeVars: this.state.theme === 'day' ? { '--canvas': 'radial-gradient(115% 80% at 88% -8%, rgba(192,132,252,0.10), transparent 46%), radial-gradient(95% 78% at -8% 108%, rgba(13,148,136,0.12), transparent 52%), #f3f6f8', '--card': '#ffffff', '--elev': '#f2f6f7', '--ink': '#0e1820', '--ink2': '#51606b', '--ink3': '#8a97a1', '--line': 'rgba(14,24,32,0.10)', '--ember': '#0d9488', '--emberSoft': 'rgba(13,148,136,0.10)', '--emberLine': 'rgba(13,148,136,0.30)', '--grid': 'rgba(14,24,32,0.06)' } : (isLab ? lab : cockpit),
      setLab: () => this.setState({ theme: 'lab' }),
      setCockpit: () => this.setState({ theme: 'cockpit' }), setDay: () => this.setState({ theme: 'day' }),
      labBtn: seg(this.state.theme === 'lab'), cockpitBtn: seg(this.state.theme === 'cockpit'), dayBtn: seg(this.state.theme === 'day'),
      setSignIn: () => this.setState({ mode: 'signin' }),
      setSignUp: () => this.setState({ mode: 'signup' }),
      toggleMode: () => this.setState(s => ({ mode: s.mode === 'signin' ? 'signup' : 'signin' })),
      signInTab: tab(!isSignUp), signUpTab: tab(isSignUp),
      isSignUp, isSignIn: !isSignUp,
      inputStyle,
      heading: isSignUp ? 'Create your account' : 'Welcome back',
      subhead: isSignUp ? 'Start turning raw activity files into training insight.' : 'Sign in to pick up where your last session left off.',
      submitLabel: isSignUp ? 'Create account' : 'Sign in',
      footerText: isSignUp ? 'Already training with us?' : 'New to Cadence?',
      footerLink: isSignUp ? 'Sign in' : 'Create an account',
    };
  }
}
</script>
</body>
</html>
